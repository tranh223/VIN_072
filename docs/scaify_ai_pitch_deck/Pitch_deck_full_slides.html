    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; background:var(--bar); border-bottom:1px solid rgba(155,114,249,.25); flex-shrink:0; flex-wrap:wrap; }

    .controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    button, select { font-family:inherit; font-size:.85rem; }

    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button.primary { background:linear-gradient(135deg, #4136c3, #9b72f9); border-color:transparent; }
    button.primary:hover { filter:brightness(1.08); }
    button:disabled { opacity:.45; cursor:not-allowed; pointer-events:none; }
    select { padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.15); background:#1b1b23; color:var(--text); min-width:220px; max-width:min(420px, 100vw); }
    .frame-wrap { flex:1; min-height:0; display:flex; align-items:stretch; justify-content:center; padding:8px; background:#0e0e12; }
    iframe { flex:1; width:100%; max-width:1920px; border:0; border-radius:10px; background:#fcf8ff; box-shadow:0 20px 60px rgba(0,0,0,.45); }
    .hint { font-size:.75rem; color:var(--muted); padding:6px 16px 10px; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    kbd { font-size:.7rem; padding:2px 6px; border-radius:4px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); }

    "html": "<!DOCTYPE html><html lang=\"vi\"><head>\n<base href=\"file:///C:/AI%20VinUni/A20-App-072/docs/scaify_ai_pitch_deck/slides/\">\r\n<meta charset=\"utf-8\">\r\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\">\r\n<title>Scaify - Đối soát và chuẩn bị hồ sơ thuế thông minh</title>\r\n<!-- Google Fonts: Noto Sans -->\r\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\">\r\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\">\r\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap\" rel=\"stylesheet\">\r\n<!-- Material Symbols -->\r\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\">\r\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\">\r\n<!-- Tailwind CSS -->\r\n<script src=\"https://cdn.tailwindcss.com?plugins=forms,container-queries\"><\\/script>\r\n<!-- Tailwind Config from Design System -->\r\n<script id=\"tailwind-config\">\r\n        tailwind.config = {\r\n            darkMode: \"class\",\r\n            theme: {\r\n                extend: {\r\n                    \"colors\": {\r\n                        \"surface\": \"#fcf8ff\",\r\n                        \"surface-tint\": \"#5249d3\",\r\n                        \"outline-variant\": \"#CBC3D6\",\r\n                        \"inverse-on-surface\": \"#f3effb\",\r\n                        \"surface-container-lowest\": \"#ffffff\",\r\n                        \"background\": \"#fcf8ff\",\r\n                        \"on-secondary\": \"#ffffff\",\r\n                        \"on-surface\": \"#1b1b23\",\r\n                        \"on-tertiary-container\": \"#a4c1ff\",\r\n                        \"on-primary\": \"#ffffff\",\r\n                        \"primary-container\": \"#4136c3\",\r\n                        \"on-tertiary\": \"#ffffff\",\r\n                        \"on-secondary-fixed\": \"#2a0053\",\r\n                        \"primary\": \"#2812ad\",\r\n                        \"secondary-fixed-dim\": \"#dab9ff\",\r\n                        \"tertiary-fixed-dim\": \"#adc6ff\",\r\n                        \"surface-dim\": \"#dcd8e4\",\r\n                        \"secondary-container\": \"#c99dfe\",\r\n                        \"inverse-surface\": \"#302f38\",\r\n                        \"tertiary\": \"#003578\",\r\n                        \"surface-container-highest\": \"#e4e1ed\",\r\n                        \"surface-container-high\": \"#eae6f2\",\r\n                        \"surface-highest\": \"#E2E2E2\",\r\n                        \"primary-fixed-dim\": \"#c3c0ff\",\r\n                        \"on-primary-fixed\": \"#100069\",\r\n                        \"on-background\": \"#1b1b23\",\r\n                        \"on-secondary-container\": \"#572d87\",\r\n                        \"on-tertiary-fixed\": \"#001a41\",\r\n                        \"error-container\": \"#ffdad6\",\r\n                        \"on-error-container\": \"#93000a\",\r\n                        \"surface-lowest\": \"#FFFFFF\",\r\n                        \"on-primary-container\": \"#bdb9ff\",\r\n                        \"tertiary-fixed\": \"#d8e2ff\",\r\n                        \"on-surface-variant\": \"#464554\",\r\n                        \"on-error\": \"#ffffff\",\r\n                        \"surface-bright\": \"#fcf8ff\",\r\n                        \"error\": \"#BA1A1A\",\r\n                        \"on-secondary-fixed-variant\": \"#5a318a\",\r\n                        \"surface-container-low\": \"#f6f2fe\",\r\n                        \"tertiary-container\": \"#204d95\",\r\n                        \"inverse-primary\": \"#c3c0ff\",\r\n                        \"secondary-fixed\": \"#eedbff\",\r\n                        \"primary-fixed\": \"#E9DDFF\",\r\n                        \"surface-variant\": \"#e4e1ed\",\r\n                        \"on-primary-fixed-variant\": \"#392cbb\",\r\n                        \"surface-container\": \"#f0ecf8\",\r\n                        \"secondary\": \"#734aa4\",\r\n                        \"outline\": \"#777586\",\r\n                        \"on-tertiary-fixed-variant\": \"#13448d\"\r\n                    },\r\n                    \"borderRadius\": {\r\n                        \"DEFAULT\": \"0.25rem\",\r\n                        \"lg\": \"0.5rem\",\r\n                        \"xl\": \"0.75rem\",\r\n                        \"full\": \"9999px\"\r\n                    },\r\n                    \"spacing\": {\r\n                        \"margin-mobile\": \"16px\",\r\n                        \"2xl\": \"48px\",\r\n                        \"sm\": \"8px\",\r\n                        \"gutter\": \"24px\",\r\n                        \"md\": \"16px\",\r\n                        \"xs\": \"4px\",\r\n                        \"lg\": \"24px\",\r\n                        \"xl\": \"32px\",\r\n                        \"margin-desktop\": \"32px\",\r\n                        \"3xl\": \"64px\",\r\n                        \"base\": \"8px\"\r\n                    },\r\n                    \"fontFamily\": {\r\n                        \"headline-lg\": [\"Noto Sans\", \"sans-serif\"],\r\n                        \"label-sm\": [\"Noto Sans\", \"sans-serif\"],\r\n                        \"label-lg\": [\"Noto Sans\", \"sans-serif\"],\r\n                        \"body-md\": [\"Noto Sans\", \"sans-serif\"],\r\n                        \"body-lg\": [\"Noto Sans\", \"sans-serif\"],\r\n                        \"title-lg\": [\"Noto Sans\", \"sans-serif\"],\r\n                        \"display-lg\": [\"Noto Sans\", \"sans-serif\"],\r\n                        \"headline-lg-mobile\": [\"Noto Sans\", \"sans-serif\"]\r\n                    },\r\n                    \"fontSize\": {\r\n                        \"headline-lg\": [\"32px\", { \"lineHeight\": \"40px\", \"fontWeight\": \"400\" }],\r\n                        \"label-sm\": [\"11px\", { \"lineHeight\": \"16px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"500\" }],\r\n                        \"label-lg\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.1px\", \"fontWeight\": \"500\" }],\r\n                        \"body-md\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.25px\", \"fontWeight\": \"400\" }],\r\n                        \"body-lg\": [\"16px\", { \"lineHeight\": \"24px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"400\" }],\r\n                        \"title-lg\": [\"22px\", { \"lineHeight\": \"28px\", \"fontWeight\": \"500\" }],\r\n                        \"display-lg\": [\"57px\", { \"lineHeight\": \"64px\", \"letterSpacing\": \"-0.25px\", \"fontWeight\": \"400\" }],\r\n                        \"headline-lg-mobile\": [\"28px\", { \"lineHeight\": \"36px\", \"fontWeight\": \"400\" }]\r\n                    }\r\n                }\r\n            }\r\n        }\r\n    <\\/script>\r\n<style>\r\n        /* Base styles to enforce slide aspect ratio constraints in browser */\r\n        body {\r\n            background-color: #e4e1ed; /* surface-variant to frame the slide */\r\n            display: flex;\r\n            align-items: center;\r\n            justify-content: center;\r\n            min-height: 100vh;\r\n            margin: 0;\r\n            overflow: auto;\r\n        }\r\n        /* Khung 16:9; nội dung dài cuộn trong main (header/footer cố định) */\r\n        #slide-canvas {\r\n            width: 100%;\r\n            max-width: 1920px;\r\n            height: min(56.25vw, 100vh, 100dvh); /* 9/16 của chiều ngang, tối đa full màn hình */\r\n            max-height: 100vh;\r\n            background-color: #fcf8ff;\r\n            box-shadow: 0 25px 50px -12px rgba(40, 18, 173, 0.1);\r\n            position: relative;\r\n            display: flex;\r\n            flex-direction: column;\r\n            overflow: hidden;\r\n            min-height: 0;\r\n        }\r\n        /* Typography overrides to ensure font family applies correctly */\r\n        * {\r\n            font-family: 'Noto Sans', sans-serif;\r\n        }\r\n        /* Icon styling */\r\n        .material-symbols-outlined {\r\n            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;\r\n        }\r\n    </style>\r\n<style data-stitch-cursor=\"\"></style><style data-stitch-scroll-lock=\"\"></style></head>\r\n<body>\r\n<!-- 1920x1080 Presentation Slide Canvas -->\r\n<div id=\"slide-canvas\">\r\n<!-- TopAppBar Shared Component Logic -->\r\n<header class=\"flex justify-between items-center w-full px-margin-desktop py-md max-w-full bg-surface z-10 shrink-0\">\r\n<div class=\"flex items-center gap-sm\"><img src=\"../assets/scaify-logo.png\" alt=\"Scaify Logo\" class=\"h-8 w-auto object-contain\"></div>\r\n<div class=\"flex items-center gap-md\">\r\n<!-- Suppressed navigation logic: This is a presentation slide, linear intent. Suppressing global nav links. -->\r\n<button class=\"cursor-pointer transition-opacity active:opacity-70 w-10 h-10 rounded-full hover:bg-surface-container flex items-center justify-center text-primary\">\r\n<span class=\"material-symbols-outlined\" data-icon=\"account_circle\">account_circle</span>\r\n</button>\r\n</div>\r\n</header>\r\n<!-- Main Content Canvas -->\r\n<main class=\"flex-grow flex flex-col justify-start px-margin-desktop py-xl overflow-y-auto min-h-0 relative overscroll-y-contain\">\r\n<!-- Background decorative elements for modern corporate vibe -->\r\n<div class=\"absolute top-0 right-0 w-[800px] h-[800px] bg-primary-fixed-dim opacity-10 rounded-full blur-[100px] -translate-y-1/2 translate-x-1/4 pointer-events-none\"></div>\r\n<div class=\"absolute bottom-0 left-0 w-[600px] h-[600px] bg-secondary-fixed-dim opacity-10 rounded-full blur-[80px] translate-y-1/3 -translate-x-1/4 pointer-events-none\"></div>\r\n<div class=\"grid grid-cols-12 gap-gutter min-h-0 z-10\">\r\n<!-- Left Column: SCQA Content (Bento Grid Style) -->\r\n<div class=\"col-span-7 flex flex-col justify-start min-h-0 gap-lg\">\r\n<h1 class=\"font-display-lg text-display-lg text-on-surface font-bold leading-tight\">\r\n                        Đối soát &amp; chuẩn bị <br>\r\n<span class=\"text-primary\">hồ sơ thuế thông minh</span>\r\n</h1>\r\n<p class=\"font-body-lg text-body-lg text-on-surface-variant mt-md pr-md border-l-4 border-primary pl-md italic max-w-2xl\">\r\n                        Chúng tôi giúp <strong>hộ kinh doanh / cá nhân bán online</strong> (Facebook, Zalo, TikTok, web — <strong>không</strong> settlement sàn) <strong>khớp CSV ↔ chứng từ</strong>, xem trước thuế và cảnh báo ngưỡng <strong>bằng OCR/VLM + rule minh bạch</strong>, thay vì chỉ Excel/Google Sheet dễ lệch tay.\r\n                    </p>\r\n<!-- SCQA Bento Grid -->\r\n<div class=\"grid grid-cols-2 gap-md mt-sm\">\r\n<!-- Situation (Bối cảnh) -->\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant hover:bg-surface-container transition-colors h-full flex flex-col\">\r\n<div class=\"w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center mb-md shrink-0\">\r\n<span class=\"material-symbols-outlined text-on-surface-variant\">storefront</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-sm\">Bối cảnh (Situation)</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant flex-grow\">\r\n                                Người bán đa kênh tự ghi doanh thu (CSV) từ Facebook, Zalo, TikTok, Instagram, website — các kênh <strong>không có chức năng thanh toán tập trung</strong> như sàn TMĐT; dữ liệu rời rạc giữa file và chứng cứ ảnh/PDF.\r\n                            </p>\r\n</div>\r\n<!-- Complication (Mâu thuẫn) -->\r\n<div class=\"bg-error-container rounded-xl p-lg border border-transparent h-full flex flex-col\">\r\n<div class=\"w-12 h-12 rounded-full bg-[#ffb4ab] flex items-center justify-center mb-md shrink-0\">\r\n<span class=\"material-symbols-outlined text-on-error-container\" style=\"font-variation-settings: &quot;FILL&quot; 1;\">warning</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-error-container mb-sm\">Mâu thuẫn (Complication)</h3>\r\n<p class=\"font-body-md text-body-md text-[#93000a] flex-grow opacity-90\">\r\n                                Đối soát thủ công kéo dài, dễ <strong>lệch số</strong> khi gần/vượt ngưỡng chịu thuế; thiếu <strong>giải thích “vì sao con số này”</strong> → stress trước kỳ khai và rủi ro giải trình.\r\n                            </p>\r\n</div>\r\n<!-- Question (Câu hỏi) -->\r\n<div class=\"col-span-2 bg-surface-container rounded-xl p-lg border border-outline-variant flex items-center gap-lg\">\r\n<div class=\"w-14 h-14 rounded-full bg-secondary-container flex items-center justify-center shrink-0\">\r\n<span class=\"material-symbols-outlined text-on-secondary-container text-[28px]\">psychology_alt</span>\r\n</div>\r\n<div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-xs\">Bài toán đặt ra</h3>\r\n<p class=\"font-body-lg text-body-lg text-on-surface-variant italic\">\r\n                                    \"Làm sao <strong>giảm sai sót</strong> khi tổng hợp &amp; đối soát dữ liệu tự ghi, có <strong>cảnh báo lệch</strong> và <strong>Explain Tax</strong> minh bạch — mà không cần mở rộng đội kế toán?\"\r\n                                </p>\r\n</div>\r\n</div>\r\n<!-- Answer (Giải pháp) -->\r\n<div class=\"col-span-2 bg-primary rounded-xl p-xl shadow-lg relative overflow-hidden flex items-center gap-lg mt-sm\">\r\n<!-- Decorative background glow for primary card -->\r\n<div class=\"absolute inset-0 bg-gradient-to-br from-primary-container/30 to-transparent pointer-events-none\"></div>\r\n<div class=\"w-16 h-16 rounded-full bg-surface flex items-center justify-center shrink-0 shadow-md relative z-10\">\r\n<span class=\"material-symbols-outlined text-primary text-[32px]\" style=\"font-variation-settings: &quot;FILL&quot; 1;\">auto_awesome</span>\r\n</div>\r\n<div class=\"relative z-10\">\r\n<h2 class=\"font-headline-lg text-headline-lg text-on-primary mb-xs\">Scaify</h2>\r\n<p class=\"font-body-lg text-body-lg text-primary-fixed-dim\">\r\n                                    Tự động hóa đối soát CSV với chứng từ (OCR/VLM), preview GTGT/TNCN theo ngành, compliance score &amp; ngưỡng 1 tỷ/năm — dashboard chỉ ra chỗ cần sửa.\r\n                                </p>\r\n</div>\r\n</div>\r\n</div>\r\n</div>\r\n<!-- Right Column: Hero Illustration -->\r\n<div class=\"col-span-5 flex items-start justify-center min-h-0 pl-lg pt-2\">\r\n<div class=\"w-full aspect-[3/4] max-h-[800px] rounded-2xl overflow-hidden shadow-2xl relative border border-outline-variant/30\">\r\n<img alt=\"Data Visualization Concept\" class=\"w-full h-full object-cover object-center\" data-alt=\"A high-end, futuristic 3D digital illustration representing artificial intelligence processing massive amounts of scattered e-commerce sales data. The scene features abstract glowing geometric data nodes, holographic charts, and flowing light trails converging into a central, organized, and structured database core. The color palette relies heavily on deep indigo, vibrant violet (#5249d3, #2812ad), and soft white (#fcf8ff), adhering to a modern corporate light-mode aesthetic. The lighting is studio-quality, high-key, creating a clean, professional, and technologically advanced mood suitable for an enterprise software presentation.\" src=\"https://lh3.googleusercontent.com/aida-public/AB6AXuBUKwCspDx63Uq0IKb1xn7lhB_NRiBDEe3VKvu1XrSatCKf9-h7HlRpuFYXc0VVS51saXA6YJiKU2Yz6O4NygOeH491J8zJx0YGWa8AKg-ax6F2CKKyzVoRx93JyQswsyyvpn70gYEcyVr2wCAXfxQ5TZy81_5cLcfZyBhP_0XO1VlAOa35x9Kx9KztI02OLXkZH5nLG0CjhsORf1deXLElwL72HXNz8beWdJj1E1NYPyDlB_8A3gfV0GUOCLRJriDOT10U1S1OL5E\">\r\n<!-- Overlay gradient to blend image smoothly into the layout -->\r\n<div class=\"absolute inset-0 bg-gradient-to-t from-surface/80 via-transparent to-transparent\"></div>\r\n<!-- Floating Glassmorphism Data Card -->\r\n<div class=\"absolute bottom-lg left-lg right-lg bg-surface/80 backdrop-blur-md rounded-xl p-md border border-surface-lowest/50 shadow-lg flex items-center gap-md\">\r\n<div class=\"w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center\">\r\n<span class=\"material-symbols-outlined text-on-tertiary-container\">done_all</span>\r\n</div>\r\n<div>\r\n<div class=\"font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider\">Trạng thái xử lý</div>\r\n<div class=\"font-title-lg text-title-lg text-on-surface font-semibold\">Khớp có kiểm chứng</div>\r\n</div>\r\n</div>\r\n</div>\r\n</div>\r\n</div>\r\n</main>\r\n<!-- Footer Shared Component Logic -->\r\n<footer class=\"flex justify-between items-center w-full px-margin-desktop py-md bg-surface-container-low shrink-0 border-t border-surface-dim/30\">\r\n<span class=\"font-label-lg text-label-lg font-semibold text-on-surface\">\r\n                Scaify\r\n            </span>\r\n<div class=\"flex items-center gap-lg\">\r\n<span class=\"font-label-sm text-label-sm text-on-surface-variant\">© 2026 Scaify AI. MVP — không thay thế kê khai chính thức.</span>\r\n<div class=\"flex gap-md\">\r\n<a class=\"font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors\" href=\"#\">Privacy Policy</a>\r\n<a class=\"font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors\" href=\"#\">Contact Support</a>\r\n</div>\r\n</div>\r\n</footer>\r\n</div>\r\n\r\n\r\n</body></html>"

    "html": "<!DOCTYPE html><html lang=\"vi\"><head>\n<base href=\"file:///C:/AI%20VinUni/A20-App-072/docs/scaify_ai_pitch_deck/slides/\">\r\n<meta charset=\"utf-8\">\r\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\">\r\n<title>Nỗi đau của người bán online - Scaify</title>\r\n<!-- Google Fonts -->\r\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\">\r\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\">\r\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap\" rel=\"stylesheet\">\r\n<!-- Material Symbols -->\r\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\">\r\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\">\r\n<!-- Tailwind CSS -->\r\n<script src=\"https://cdn.tailwindcss.com?plugins=forms,container-queries\"><\\/script>\r\n<!-- Tailwind Configuration -->\r\n<script id=\"tailwind-config\">\r\n        tailwind.config = {\r\n            darkMode: \"class\",\r\n            theme: {\r\n                extend: {\r\n                    \"colors\": {\r\n                        \"surface\": \"#fcf8ff\",\r\n                        \"surface-tint\": \"#5249d3\",\r\n                        \"outline-variant\": \"#CBC3D6\",\r\n                        \"inverse-on-surface\": \"#f3effb\",\r\n                        \"surface-container-lowest\": \"#ffffff\",\r\n                        \"background\": \"#fcf8ff\",\r\n                        \"on-secondary\": \"#ffffff\",\r\n                        \"on-surface\": \"#1b1b23\",\r\n                        \"on-tertiary-container\": \"#a4c1ff\",\r\n                        \"on-primary\": \"#ffffff\",\r\n                        \"primary-container\": \"#4136c3\",\r\n                        \"on-tertiary\": \"#ffffff\",\r\n                        \"on-secondary-fixed\": \"#2a0053\",\r\n                        \"primary\": \"#2812ad\",\r\n                        \"secondary-fixed-dim\": \"#dab9ff\",\r\n                        \"tertiary-fixed-dim\": \"#adc6ff\",\r\n                        \"surface-dim\": \"#dcd8e4\",\r\n                        \"secondary-container\": \"#c99dfe\",\r\n                        \"inverse-surface\": \"#302f38\",\r\n                        \"tertiary\": \"#003578\",\r\n                        \"surface-container-highest\": \"#e4e1ed\",\r\n                        \"surface-container-high\": \"#eae6f2\",\r\n                        \"surface-highest\": \"#E2E2E2\",\r\n                        \"primary-fixed-dim\": \"#c3c0ff\",\r\n                        \"on-primary-fixed\": \"#100069\",\r\n                        \"on-background\": \"#1b1b23\",\r\n                        \"on-secondary-container\": \"#572d87\",\r\n                        \"on-tertiary-fixed\": \"#001a41\",\r\n                        \"error-container\": \"#ffdad6\",\r\n                        \"on-error-container\": \"#93000a\",\r\n                        \"surface-lowest\": \"#FFFFFF\",\r\n                        \"on-primary-container\": \"#bdb9ff\",\r\n                        \"tertiary-fixed\": \"#d8e2ff\",\r\n                        \"on-surface-variant\": \"#464554\",\r\n                        \"on-error\": \"#ffffff\",\r\n                        \"surface-bright\": \"#fcf8ff\",\r\n                        \"error\": \"#BA1A1A\",\r\n                        \"on-secondary-fixed-variant\": \"#5a318a\",\r\n                        \"surface-container-low\": \"#f6f2fe\",\r\n                        \"tertiary-container\": \"#204d95\",\r\n                        \"inverse-primary\": \"#c3c0ff\",\r\n                        \"secondary-fixed\": \"#eedbff\",\r\n                        \"primary-fixed\": \"#E9DDFF\",\r\n                        \"surface-variant\": \"#e4e1ed\",\r\n                        \"on-primary-fixed-variant\": \"#392cbb\",\r\n                        \"surface-container\": \"#f0ecf8\",\r\n                        \"secondary\": \"#734aa4\",\r\n                        \"outline\": \"#777586\",\r\n                        \"on-tertiary-fixed-variant\": \"#13448d\"\r\n                    },\r\n                    \"borderRadius\": {\r\n                        \"DEFAULT\": \"0.25rem\",\r\n                        \"lg\": \"0.5rem\",\r\n                        \"xl\": \"0.75rem\",\r\n                        \"full\": \"9999px\"\r\n                    },\r\n                    \"spacing\": {\r\n                        \"margin-mobile\": \"16px\",\r\n                        \"2xl\": \"48px\",\r\n                        \"sm\": \"8px\",\r\n                        \"gutter\": \"24px\",\r\n                        \"md\": \"16px\",\r\n                        \"xs\": \"4px\",\r\n                        \"lg\": \"24px\",\r\n                        \"xl\": \"32px\",\r\n                        \"margin-desktop\": \"32px\",\r\n                        \"3xl\": \"64px\",\r\n                        \"base\": \"8px\"\r\n                    },\r\n                    \"fontFamily\": {\r\n                        \"headline-lg\": [\"Noto Sans\"],\r\n                        \"label-sm\": [\"Noto Sans\"],\r\n                        \"label-lg\": [\"Noto Sans\"],\r\n                        \"body-md\": [\"Noto Sans\"],\r\n                        \"body-lg\": [\"Noto Sans\"],\r\n                        \"title-lg\": [\"Noto Sans\"],\r\n                        \"display-lg\": [\"Noto Sans\"],\r\n                        \"headline-lg-mobile\": [\"Noto Sans\"]\r\n                    },\r\n                    \"fontSize\": {\r\n                        \"headline-lg\": [\"32px\", { \"lineHeight\": \"40px\", \"fontWeight\": \"400\" }],\r\n                        \"label-sm\": [\"11px\", { \"lineHeight\": \"16px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"500\" }],\r\n                        \"label-lg\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.1px\", \"fontWeight\": \"500\" }],\r\n                        \"body-md\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.25px\", \"fontWeight\": \"400\" }],\r\n                        \"body-lg\": [\"16px\", { \"lineHeight\": \"24px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"400\" }],\r\n                        \"title-lg\": [\"22px\", { \"lineHeight\": \"28px\", \"fontWeight\": \"500\" }],\r\n                        \"display-lg\": [\"57px\", { \"lineHeight\": \"64px\", \"letterSpacing\": \"-0.25px\", \"fontWeight\": \"400\" }],\r\n                        \"headline-lg-mobile\": [\"28px\", { \"lineHeight\": \"36px\", \"fontWeight\": \"400\" }]\r\n                    }\r\n                }\r\n            }\r\n        }\r\n    <\\/script>\r\n<style>\r\n        .material-symbols-outlined {\r\n            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;\r\n        }\r\n        .icon-fill {\r\n            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;\r\n        }\r\n    </style>\r\n<style data-stitch-cursor=\"\"></style><style data-stitch-scroll-lock=\"\"></style></head>\r\n<body class=\"bg-surface text-on-surface antialiased min-h-screen flex flex-col\">\r\n<!-- TopAppBar -->\r\n<header class=\"bg-surface dark:bg-on-surface docked full-width top-0 z-50 flat no shadows border-b border-surface-container-highest\">\r\n<div class=\"flex justify-between items-center w-full px-margin-desktop py-md max-w-full\">\r\n<div class=\"font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed-dim\"><img src=\"../assets/scaify-logo.png\" alt=\"Scaify Logo\" class=\"h-8 md:h-10 w-auto object-contain\"></div>\r\n<div class=\"flex items-center gap-md\">\r\n<button class=\"text-on-surface-variant dark:text-outline-variant hover:text-primary-container dark:hover:text-primary-fixed-dim transition-colors cursor-pointer transition-opacity active:opacity-70 p-sm rounded-full hover:bg-surface-container-high\">\r\n<span class=\"material-symbols-outlined text-headline-lg\">account_circle</span>\r\n</button>\r\n</div>\r\n</div>\r\n</header>\r\n<!-- Main Content -->\r\n<main class=\"flex-grow px-margin-mobile md:px-margin-desktop py-2xl md:py-3xl max-w-7xl mx-auto w-full\">\r\n<!-- Header Section -->\r\n<div class=\"mb-xl md:mb-3xl max-w-5xl\">\r\n<h1 class=\"font-display-lg text-display-lg text-on-surface font tracking-tight mb-md hidden md:block\">\r\n                Nỗi đau của người bán online\r\n            </h1>\r\n<h1 class=\"font-headline-lg-mobile text-headline-lg-mobile text-on-surface font tracking-tight mb-md md:hidden\">\r\n                Nỗi đau của người bán online\r\n            </h1>\r\n<p class=\"font-title-lg text-title-lg text-on-surface-variant leading-relaxed\">\r\n                Khi dữ liệu phát triển nhanh hơn khả năng xử lý thủ công, sự rời rạc trở thành rủi ro lớn nhất.\r\n            </p>\r\n</div>\r\n<!-- The Core Problem Banner (Glassmorphism inspired) -->\r\n<div class=\"mb-2xl md:mb-3xl bg-primary-container text-on-primary-container rounded-xl p-lg md:p-xl shadow-sm border border-primary/20 relative overflow-hidden\">\r\n<div class=\"absolute -right-20 -top-20 opacity-10 pointer-events-none\">\r\n<span class=\"material-symbols-outlined\" style=\"font-size: 200px; font-variation-settings: 'FILL' 1;\">warning</span>\r\n</div>\r\n<div class=\"relative z-10 flex flex-col md:flex-row gap-lg items-start md:items-center\">\r\n<div class=\"p-md bg-on-primary-container text-primary-container rounded-full flex-shrink-0\">\r\n<span class=\"material-symbols-outlined text-headline-lg icon-fill\">crisis_alert</span>\r\n</div>\r\n<div>\r\n<h2 class=\"font-headline-lg text-headline-lg font-semibold mb-sm\">Vấn đề cốt lõi</h2>\r\n<p class=\"font-body-lg text-body-lg opacity-90 leading-relaxed max-w-4xl\">\r\n                        Hoàn toàn <strong>thiếu vắng một hệ thống tinh gọn</strong> để tự động hóa việc biến dữ liệu thô, rời rạc từ nhiều nguồn thành các hồ sơ rà soát chuẩn chỉnh, đáng tin cậy.\r\n                    </p>\r\n</div>\r\n</div>\r\n</div>\r\n<!-- Bento Grid Comparison Table -->\r\n<div class=\"grid grid-cols-1 lg:grid-cols-2 gap-gutter\">\r\n<!-- Step 1: Gom dữ liệu -->\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant hover:bg-surface-container-high transition-colors duration-300 flex flex-col h-full shadow-sm\">\r\n<div class=\"flex items-center gap-md mb-lg\">\r\n<div class=\"p-sm bg-primary/10 text-primary rounded-lg\">\r\n<span class=\"material-symbols-outlined text-title-lg\">database</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg font-bold text-on-surface\">1. Gom dữ liệu</h3>\r\n</div>\r\n<div class=\"grid grid-cols-1 md:grid-cols-2 gap-md flex-grow\">\r\n<!-- Reality -->\r\n<div class=\"bg-surface-container rounded-lg p-md border border-surface-variant\">\r\n<div class=\"flex items-center gap-sm mb-sm text-on-surface-variant\">\r\n<span class=\"material-symbols-outlined text-label-lg\">history</span>\r\n<span class=\"font-label-lg text-label-lg font-semibold uppercase tracking-wider\">Thực tế thủ công</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md text-on-surface\">\r\n                            Tải file Excel thủ công từ nhiều nguồn khác nhau (sàn TMĐT, sao kê ngân hàng, đơn vị vận chuyển). Định dạng lộn xộn, không đồng nhất.\r\n                        </p>\r\n</div>\r\n<!-- Problem -->\r\n<div class=\"bg-error-container text-on-error-container rounded-lg p-md border border-error/20\">\r\n<div class=\"flex items-center gap-sm mb-sm\">\r\n<span class=\"material-symbols-outlined text-label-lg\">warning</span>\r\n<span class=\"font-label-lg text-label-lg font-semibold uppercase tracking-wider\">Vấn đề nảy sinh</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md\">\r\n                            Tốn hàng giờ đồng hồ mỗi ngày chỉ để gom file. Dễ tải thiếu sót dữ liệu, chứa nhiều dữ liệu rác gây nhiễu loạn bước sau.\r\n                        </p>\r\n</div>\r\n</div>\r\n</div>\r\n<!-- Step 2: Rà soát -->\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant hover:bg-surface-container-high transition-colors duration-300 flex flex-col h-full shadow-sm\">\r\n<div class=\"flex items-center gap-md mb-lg\">\r\n<div class=\"p-sm bg-primary/10 text-primary rounded-lg\">\r\n<span class=\"material-symbols-outlined text-title-lg\">plagiarism</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg font-bold text-on-surface\">2. Rà soát &amp; Đối chiếu</h3>\r\n</div>\r\n<div class=\"grid grid-cols-1 md:grid-cols-2 gap-md flex-grow\">\r\n<!-- Reality -->\r\n<div class=\"bg-surface-container rounded-lg p-md border border-surface-variant\">\r\n<div class=\"flex items-center gap-sm mb-sm text-on-surface-variant\">\r\n<span class=\"material-symbols-outlined text-label-lg\">history</span>\r\n<span class=\"font-label-lg text-label-lg font-semibold uppercase tracking-wider\">Thực tế thủ công</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md text-on-surface\">\r\n                            Phụ thuộc hoàn toàn vào Excel. Dùng hàm VLOOKUP, INDEX MATCH chéo qua lại giữa hàng vạn dòng dữ liệu phức tạp.\r\n                        </p>\r\n</div>\r\n<!-- Problem -->\r\n<div class=\"bg-error-container text-on-error-container rounded-lg p-md border border-error/20\">\r\n<div class=\"flex items-center gap-sm mb-sm\">\r\n<span class=\"material-symbols-outlined text-label-lg\">warning</span>\r\n<span class=\"font-label-lg text-label-lg font-semibold uppercase tracking-wider\">Vấn đề nảy sinh</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md\">\r\n                            Máy tính thường xuyên treo, giật lag. Sai số cực cao do thao tác kéo thả nhầm lẫn. Hoàn toàn không có khả năng đối soát theo thời gian thực.\r\n                        </p>\r\n</div>\r\n</div>\r\n</div>\r\n<!-- Step 3: Chuẩn bị hồ sơ -->\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant hover:bg-surface-container-high transition-colors duration-300 flex flex-col h-full shadow-sm\">\r\n<div class=\"flex items-center gap-md mb-lg\">\r\n<div class=\"p-sm bg-primary/10 text-primary rounded-lg\">\r\n<span class=\"material-symbols-outlined text-title-lg\">folder_supervised</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg font-bold text-on-surface\">3. Chuẩn bị hồ sơ</h3>\r\n</div>\r\n<div class=\"grid grid-cols-1 md:grid-cols-2 gap-md flex-grow\">\r\n<!-- Reality -->\r\n<div class=\"bg-surface-container rounded-lg p-md border border-surface-variant\">\r\n<div class=\"flex items-center gap-sm mb-sm text-on-surface-variant\">\r\n<span class=\"material-symbols-outlined text-label-lg\">history</span>\r\n<span class=\"font-label-lg text-label-lg font-semibold uppercase tracking-wider\">Thực tế thủ công</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md text-on-surface\">\r\n                            Lắp ráp các con số đã tính toán được vào các mẫu báo cáo, file tổng hợp một cách hoàn toàn thủ công bằng copy-paste.\r\n                        </p>\r\n</div>\r\n<!-- Problem -->\r\n<div class=\"bg-error-container text-on-error-container rounded-lg p-md border border-error/20\">\r\n<div class=\"flex items-center gap-sm mb-sm\">\r\n<span class=\"material-symbols-outlined text-label-lg\">warning</span>\r\n<span class=\"font-label-lg text-label-lg font-semibold uppercase tracking-wider\">Vấn đề nảy sinh</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md\">\r\n                            Mất tính toàn vẹn của dữ liệu. Khi sếp hoặc đối tác hỏi \"con số này từ đâu ra\", rất khó để truy vết ngược lại nguồn gốc ban đầu.\r\n                        </p>\r\n</div>\r\n</div>\r\n</div>\r\n<!-- Step 4: Giải thích lệch -->\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant hover:bg-surface-container-high transition-colors duration-300 flex flex-col h-full shadow-sm\">\r\n<div class=\"flex items-center gap-md mb-lg\">\r\n<div class=\"p-sm bg-primary/10 text-primary rounded-lg\">\r\n<span class=\"material-symbols-outlined text-title-lg\">balance</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg font-bold text-on-surface\">4. Giải thích số lệch</h3>\r\n</div>\r\n<div class=\"grid grid-cols-1 md:grid-cols-2 gap-md flex-grow\">\r\n<!-- Reality -->\r\n<div class=\"bg-surface-container rounded-lg p-md border border-surface-variant\">\r\n<div class=\"flex items-center gap-sm mb-sm text-on-surface-variant\">\r\n<span class=\"material-symbols-outlined text-label-lg\">history</span>\r\n<span class=\"font-label-lg text-label-lg font-semibold uppercase tracking-wider\">Thực tế thủ công</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md text-on-surface\">\r\n                            Khi phát hiện doanh thu trên sàn không khớp với tiền về tài khoản, phải bới tìm lại hàng tá file cũ để đối chiếu từng đơn hàng.\r\n                        </p>\r\n</div>\r\n<!-- Problem -->\r\n<div class=\"bg-error-container text-on-error-container rounded-lg p-md border border-error/20\">\r\n<div class=\"flex items-center gap-sm mb-sm\">\r\n<span class=\"material-symbols-outlined text-label-lg\">warning</span>\r\n<span class=\"font-label-lg text-label-lg font-semibold uppercase tracking-wider\">Vấn đề nảy sinh</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md\">\r\n                            Áp lực tâm lý lớn, mất thời gian tranh cãi không có bằng chứng rõ ràng. Rủi ro thất thoát tài chính thực sự do bỏ sót đơn hàng.\r\n                        </p>\r\n</div>\r\n</div>\r\n</div>\r\n</div>\r\n</main>\r\n<!-- Footer -->\r\n<footer class=\"bg-surface-container-low dark:bg-inverse-surface mt-auto\">\r\n<div class=\"flex flex-col md:flex-row justify-between items-center w-full px-margin-desktop py-lg border-t border-surface-container-highest\">\r\n<div class=\"font-label-lg text-label-lg font-semibold text-on-surface dark:text-surface-lowest mb-md md:mb-0\">\r\n                Scaify\r\n            </div>\r\n<div class=\"font-label-sm text-label-sm text-secondary dark:text-secondary-fixed-dim order-3 md:order-2 mt-md md:mt-0 text-center md:text-left\">\r\n                © 2026 Scaify AI Intelligence.\r\n            </div>\r\n<nav class=\"flex gap-lg order-2 md:order-3\">\r\n<a class=\"font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant hover:underline hover:text-primary dark:hover:text-primary-fixed-dim transition-all duration-200\" href=\"#\">\r\n                    Pitch Deck\r\n                </a>\r\n<a class=\"font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant hover:underline hover:text-primary dark:hover:text-primary-fixed-dim transition-all duration-200\" href=\"#\">\r\n                    Team 072\r\n                </a>\r\n</nav>\r\n</div>\r\n</footer>\r\n\r\n\r\n</body></html>"
  },

ary-fixed-variant\": \"#13448d\"\r\n              },\r\n              \"borderRadius\": {\r\n                      \"DEFAULT\": \"0.25rem\",\r\n                      \"lg\": \"0.5rem\",\r\n                      \"xl\": \"0.75rem\",\r\n                      \"full\": \"9999px\"\r\n              },\r\n              \"spacing\": {\r\n                      \"margin-mobile\": \"16px\",\r\n                      \"2xl\": \"48px\",\r\n                      \"sm\": \"8px\",\r\n                      \"gutter\": \"24px\",\r\n                      \"md\": \"16px\",\r\n                      \"xs\": \"4px\",\r\n                      \"lg\": \"24px\",\r\n                      \"xl\": \"32px\",\r\n                      \"margin-desktop\": \"32px\",\r\n                      \"3xl\": \"64px\",\r\n                      \"base\": \"8px\"\r\n              },\r\n              \"fontFamily\": {\r\n                      \"headline-lg\": [\"Noto Sans\"],\r\n                      \"label-sm\": [\"Noto Sans\"],\r\n                      \"label-lg\": [\"Noto Sans\"],\r\n                      \"body-md\": [\"Noto Sans\"],\r\n                      \"body-lg\": [\"Noto Sans\"],\r\n                      \"title-lg\": [\"Noto Sans\"],\r\n                      \"display-lg\": [\"Noto Sans\"],\r\n                      \"headline-lg-mobile\": [\"Noto Sans\"]\r\n              },\r\n              \"fontSize\": {\r\n                      \"headline-lg\": [\"32px\", { \"lineHeight\": \"40px\", \"fontWeight\": \"400\" }],\r\n                      \"label-sm\": [\"11px\", { \"lineHeight\": \"16px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"500\" }],\r\n                      \"label-lg\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.1px\", \"fontWeight\": \"500\" }],\r\n                      \"body-md\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.25px\", \"fontWeight\": \"400\" }],\r\n                      \"body-lg\": [\"16px\", { \"lineHeight\": \"24px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"400\" }],\r\n                      \"title-lg\": [\"22px\", { \"lineHeight\": \"28px\", \"fontWeight\": \"500\" }],\r\n                      \"display-lg\": [\"57px\", { \"lineHeight\": \"64px\", \"letterSpacing\": \"-0.25px\", \"fontWeight\": \"400\" }],\r\n                      \"headline-lg-mobile\": [\"28px\", { \"lineHeight\": \"36px\", \"fontWeight\": \"400\" }]\r\n              }\r\n            }\r\n          }\r\n        }\r\n    <\\/script>\r\n<style>\r\n        .material-symbols-outlined {\r\n            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;\r\n        }\r\n    </style>\r\n<style data-stitch-cursor=\"\"></style><style data-stitch-scroll-lock=\"\"></style></head>\r\n<body class=\"bg-surface text-on-surface min-h-screen flex flex-col font-body-md\">\r\n<!-- TopAppBar from JSON -->\r\n<header class=\"bg-surface docked full-width top-0 flex justify-between items-center w-full px-margin-desktop py-md max-w-full z-50\">\r\n<div class=\"flex items-center gap-md\">\r\n<span class=\"font-headline-lg text-headline-lg font-bold text-primary\"><img src=\"../assets/scaify-logo.png\" alt=\"Scaify Logo\" class=\"h-8 md:h-10 w-auto object-contain\"></span>\r\n</div>\r\n<div class=\"flex items-center gap-md\">\r\n<!-- Trailing Icons -->\r\n<button class=\"text-on-surface-variant hover:text-primary-container transition-colors cursor-pointer active:opacity-70 p-sm rounded-full hover:bg-surface-container-high\">\r\n<span class=\"material-symbols-outlined text-[24px]\">account_circle</span>\r\n</button>\r\n</div>\r\n</header>\r\n<!-- Main Content Canvas -->\r\n<main class=\"flex-grow flex flex-col items-center justify-center px-margin-desktop py-2xl w-full\">\r\n<!-- Header Section -->\r\n<div class=\"max-w-4xl w-full text-center mb-2xl\">\r\n<h1 class=\"font-display-lg text-display-lg text-primary mb-lg tracking-tight\">Scaify là gì?</h1>\r\n<p class=\"font-title-lg text-title-lg text-on-surface-variant max-w-3xl mx-auto\">\r\n                Một hệ thống lõi cung cấp <strong class=\"text-on-surface\">lớp đối soát dữ liệu và chuẩn bị hồ sơ thuế</strong> chuyên sâu. Scaify tự động hóa việc thu thập, xác minh và xử lý chứng từ với độ chính xác của doanh nghiệp, loại bỏ sai sót thủ công.\r\n            </p>\r\n</div>\r\n<!-- Bento Grid Features -->\r\n<div class=\"max-w-[1200px] w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-gutter\">\r\n<!-- Feature 1: Upload -->\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant hover:border-primary-fixed-dim hover:bg-surface-container transition-colors flex flex-col items-start gap-md col-span-1 group\">\r\n<div class=\"w-12 h-12 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center group-hover:scale-105 transition-transform\">\r\n<span class=\"material-symbols-outlined\">upload_file</span>\r\n</div>\r\n<div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-xs\">Tải lên chứng từ</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">Tích hợp đa kênh, tiếp nhận hóa đơn và biên lai tự động từ email, ERP hoặc tải lên trực tiếp một cách bảo mật.</p>\r\n</div>\r\n</div>\r\n<!-- Feature 2: OCR -->\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant hover:border-primary-fixed-dim hover:bg-surface-container transition-colors flex flex-col items-start gap-md col-span-1 group\">\r\n<div class=\"w-12 h-12 rounded-lg bg-tertiary-container text-on-tertiary-container flex items-center justify-center group-hover:scale-105 transition-transform\">\r\n<span class=\"material-symbols-outlined\">document_scanner</span>\r\n</div>\r\n<div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-xs\">Phân loại OCR</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">Nhận diện và bóc tách dữ liệu thông minh từ hình ảnh và PDF với công nghệ học máy chuyên biệt cho tài chính.</p>\r\n</div>\r\n</div>\r\n<!-- Feature 3: Reconciliation (Highlight Card) -->\r\n<div class=\"bg-primary-container rounded-xl p-lg border border-primary-fixed hover:bg-primary transition-colors flex flex-col justify-between items-start gap-md md:col-span-2 group\">\r\n<div class=\"w-12 h-12 rounded-lg bg-primary text-on-primary flex items-center justify-center group-hover:scale-105 transition-transform\">\r\n<span class=\"material-symbols-outlined\">compare_arrows</span>\r\n</div>\r\n<div class=\"mt-auto\">\r\n<h3 class=\"font-headline-lg text-headline-lg text-on-primary-container group-hover:text-on-primary mb-sm\">Đối soát tự động</h3>\r\n<p class=\"font-body-lg text-body-lg text-primary-fixed group-hover:text-surface-lowest\">Khớp nối ba chiều (3-way matching) giữa đơn hàng, biên nhận và hóa đơn. Phát hiện độ lệch và bất thường theo thời gian thực.</p>\r\n</div>\r\n</div>\r\n<!-- Feature 4: Alerts -->\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant hover:border-primary-fixed-dim hover:bg-surface-container transition-colors flex flex-col items-start gap-md col-span-1 group\">\r\n<div class=\"w-12 h-12 rounded-lg bg-error-container text-on-error-container flex items-center justify-center group-hover:scale-105 transition-transform\">\r\n<span class=\"material-symbols-outlined\">warning</span>\r\n</div>\r\n<div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-xs\">Hệ thống cảnh báo</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">Phát hiện trùng lặp, thông tin không hợp lệ hoặc thiếu sót chứng từ trước khi quyết toán thuế.</p>\r\n</div>\r\n</div>\r\n<!-- Feature 5: Storage -->\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant hover:border-primary-fixed-dim hover:bg-surface-container transition-colors flex flex-col items-start gap-md col-span-1 group\">\r\n<div class=\"w-12 h-12 rounded-lg bg-secondary-container text-on-secondary-container flex items-center justify-center group-hover:scale-105 transition-transform\">\r\n<span class=\"material-symbols-outlined\">folder_open</span>\r\n</div>\r\n<div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-xs\">Lưu trữ hồ sơ</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">Kho lưu trữ trung tâm tuân thủ tiêu chuẩn kiểm toán, dễ dàng truy xuất và quản lý quyền truy cập.</p>\r\n</div>\r\n</div>\r\n<!-- Feature 6: Reporting -->\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant hover:border-primary-fixed-dim hover:bg-surface-container transition-colors flex flex-col items-start gap-md col-span-1 group\">\r\n<div class=\"w-12 h-12 rounded-lg bg-surface-variant text-on-surface-variant flex items-center justify-center group-hover:scale-105 transition-transform\">\r\n<span class=\"material-symbols-outlined\">bar_chart</span>\r\n</div>\r\n<div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-xs\">Báo cáo chi tiết</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">Trích xuất bảng kê chuẩn bị cho tờ khai thuế và các báo cáo tổng quan tình hình đối soát nhanh chóng.</p>\r\n</div>\r\n</div>\r\n<!-- Feature 7: RAG Bot -->\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant hover:border-primary-fixed-dim hover:bg-surface-container transition-colors flex flex-col items-start gap-md col-span-1 group\">\r\n<div class=\"w-12 h-12 rounded-lg bg-inverse-surface text-inverse-on-surface flex items-center justify-center group-hover:scale-105 transition-transform\">\r\n<span class=\"material-symbols-outlined\">smart_toy</span>\r\n</div>\r\n<div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-xs\">RAG Bot giải thích</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">Trợ lý AI phân tích luật thuế và giải thích kết quả đối soát dựa trên dữ liệu doanh nghiệp và văn bản pháp luật hiện hành.</p>\r\n</div>\r\n</div>\r\n</div>\r\n</main>\r\n<!-- Footer from JSON -->\r\n<footer class=\"bg-surface-container-low docked full-width bottom-0 flex justify-between items-center w-full px-margin-desktop py-sm fixed bottom-0 left-0 z-40 border-t border-outline-variant\">\r\n<div class=\"font-label-lg text-label-lg font-semibold text-on-surface\">\r\n            Scaify\r\n        </div>\r\n<div class=\"flex gap-lg items-center\">\r\n<a class=\"font-body-md text-body-md text-on-surface-variant hover:underline hover:text-primary transition-all duration-200\" href=\"#\">Pitch Deck</a>\r\n<a class=\"font-body-md text-body-md text-on-surface-variant hover:underline hover:text-primary transition-all duration-200\" href=\"#\">Team 072</a>\r\n</div>\r\n<div class=\"font-body-md text-body-md text-secondary\">\r\n            © 2026 Scaify AI Intelligence. \r\n        </div>\r\n</footer>\r\n\r\n\r\n</body></html>"

-3xl\"></div>\r\n</div>\r\n<div class=\"relative z-10 w-full max-w-7xl flex flex-col items-center gap-3xl\">\r\n<!-- Header Section -->\r\n<div class=\"text-center max-w-3xl flex flex-col items-center gap-md\">\r\n<span class=\"font-label-lg text-label-lg text-secondary tracking-wider uppercase\">Trải nghiệm sản phẩm</span>\r\n<h1 class=\"font-display-lg text-display-lg text-on-surface\">Luồng vận hành thông minh</h1>\r\n<!-- <p class=\"font-body-lg text-body-lg text-on-surface-variant mt-sm\">Quy trình 5 bước — kể như <strong>demo 60 giây</strong>: bối cảnh → can thiệp → khoảnh khắc “aha” → giá trị (theo yêu cầu pitch deck).</p> -->\r\n</div>\r\n<!-- Demo story (4 beats) -->\r\n<div class=\"w-full max-w-6xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-md mb-2xl\">\r\n<div class=\"rounded-xl border border-outline-variant bg-surface-container-low p-md text-left\">\r\n<span class=\"font-label-sm text-primary font-bold uppercase\">1 · Bối cảnh</span>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mt-xs\">Seller tự ghi CSV doanh thu; ảnh CK / hóa đơn nằm rời — không biết dòng nào <strong>lệch</strong> trước kỳ thuế.</p>\r\n</div>\r\n<div class=\"rounded-xl border border-outline-variant bg-surface-container-low p-md text-left\">\r\n<span class=\"font-label-sm text-primary font-bold uppercase\">2 · Can thiệp</span>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mt-xs\">Upload CSV + chứng từ → OCR/VLM trích xuất → <strong>đối soát</strong> theo rule (≥5% / ≥5M).</p>\r\n</div>\r\n<div class=\"rounded-xl border border-primary/30 bg-primary-fixed/20 p-md text-left\">\r\n<span class=\"font-label-sm text-primary font-bold uppercase\">3 · Aha</span>\r\n<p class=\"font-body-md text-body-md text-on-surface mt-xs\">Dashboard chỉ đúng chỗ lệch, <strong>Explain Tax</strong> nói rõ công thức &amp; ngưỡng 1 tỷ — không chỉ một con số.</p>\r\n</div>\r\n<div class=\"rounded-xl border border-outline-variant bg-surface-container-low p-md text-left\">\r\n<span class=\"font-label-sm text-primary font-bold uppercase\">4 · Giá trị</span>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mt-xs\">Giảm giờ đối soát tay, giảm rủi ro “vỡ số” khi cơ quan thuế siết đối chiếu; <strong>AI là công cụ</strong>, outcome là minh bạch.</p>\r\n</div>\r\n</div>\r\n<!-- Flowchart Section -->\r\n<div class=\"w-full relative py-2xl\">\r\n<!-- Connecting Line (Desktop) -->\r\n<div class=\"hidden lg:block absolute top-1/2 left-0 w-full h-[2px] bg-outline-variant -translate-y-1/2 z-0\"></div>\r\n<div class=\"flex flex-col lg:flex-row items-stretch justify-between w-full gap-lg lg:gap-md relative z-10\">\r\n<!-- Step 1: Upload -->\r\n<div class=\"flex-1 flex flex-col items-center group relative\">\r\n<div class=\"w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-xl flex flex-col items-center justify-center text-center shadow-sm hover:shadow-md hover:border-primary hover:-translate-y-1 transition-all duration-300 relative z-10 h-full min-h-[200px]\">\r\n<div class=\"absolute -top-4 -left-4 w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-title-lg text-title-lg shadow-sm\">1</div>\r\n<div class=\"w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center mb-md group-hover:bg-primary transition-colors duration-300\">\r\n<span class=\"material-symbols-outlined text-primary group-hover:text-on-primary text-[32px] transition-colors duration-300\" data-icon=\"cloud_upload\" data-weight=\"fill\" style=\"font-variation-settings: 'FILL' 1;\">cloud_upload</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface\">Tải lên</h3>\r\n<p class=\"font-label-sm text-label-sm text-on-surface-variant mt-xs\">Upload dữ liệu thô</p>\r\n</div>\r\n<!-- Connector Arrow (Mobile) -->\r\n<span class=\"material-symbols-outlined text-outline-variant mt-sm lg:hidden\">arrow_downward</span>\r\n</div>\r\n<!-- Step 2: Phân loại -->\r\n<div class=\"flex-1 flex flex-col items-center group relative\">\r\n<div class=\"w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-xl flex flex-col items-center justify-center text-center shadow-sm hover:shadow-md hover:border-primary hover:-translate-y-1 transition-all duration-300 relative z-10 h-full min-h-[200px]\">\r\n<div class=\"absolute -top-4 -left-4 w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-title-lg text-title-lg shadow-sm\">2</div>\r\n<div class=\"w-16 h-16 rounded-full bg-secondary-fixed flex items-center justify-center mb-md group-hover:bg-secondary transition-colors duration-300\">\r\n<span class=\"material-symbols-outlined text-secondary group-hover:text-on-secondary text-[32px] transition-colors duration-300\" data-icon=\"document_scanner\" data-weight=\"fill\" style=\"font-variation-settings: 'FILL' 1;\">document_scanner</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface\">Phân loại</h3>\r\n<p class=\"font-label-sm text-label-sm text-secondary mt-xs font-semibold\">(OCR / VLM)</p>\r\n</div>\r\n<!-- Connector Arrow (Mobile) -->\r\n<span class=\"material-symbols-outlined text-outline-variant mt-sm lg:hidden\">arrow_downward</span>\r\n</div>\r\n<!-- Step 3: Đối soát -->\r\n<div class=\"flex-1 flex flex-col items-center group relative\">\r\n<div class=\"w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-xl flex flex-col items-center justify-center text-center shadow-sm hover:shadow-md hover:border-primary hover:-translate-y-1 transition-all duration-300 relative z-10 h-full min-h-[200px]\">\r\n<div class=\"absolute -top-4 -left-4 w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-title-lg text-title-lg shadow-sm\">3</div>\r\n<div class=\"w-16 h-16 rounded-full bg-tertiary-fixed flex items-center justify-center mb-md group-hover:bg-tertiary transition-colors duration-300\">\r\n<span class=\"material-symbols-outlined text-tertiary group-hover:text-on-tertiary text-[32px] transition-colors duration-300\" data-icon=\"fact_check\" data-weight=\"fill\" style=\"font-variation-settings: 'FILL' 1;\">fact_check</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface\">Đối soát</h3>\r\n<p class=\"font-label-sm text-label-sm text-on-surface-variant mt-xs\">Kiểm tra tính hợp lệ</p>\r\n</div>\r\n<!-- Connector Arrow (Mobile) -->\r\n<span class=\"material-symbols-outlined text-outline-variant mt-sm lg:hidden\">arrow_downward</span>\r\n</div>\r\n<!-- Step 4: Lưu trữ -->\r\n<div class=\"flex-1 flex flex-col items-center group relative\">\r\n<div class=\"w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-xl flex flex-col items-center justify-center text-center shadow-sm hover:shadow-md hover:border-primary hover:-translate-y-1 transition-all duration-300 relative z-10 h-full min-h-[200px]\">\r\n<div class=\"absolute -top-4 -left-4 w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-title-lg text-title-lg shadow-sm\">4</div>\r\n<div class=\"w-16 h-16 rounded-full bg-primary-fixed-dim flex items-center justify-center mb-md group-hover:bg-primary-container transition-colors duration-300\">\r\n<span class=\"material-symbols-outlined text-primary-container group-hover:text-on-primary-container text-[32px] transition-colors duration-300\" data-icon=\"database\" data-weight=\"fill\" style=\"font-variation-settings: 'FILL' 1;\">database</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface\">Lưu trữ</h3>\r\n<p class=\"font-label-sm text-label-sm text-on-surface-variant mt-xs\">Hệ thống bảo mật</p>\r\n</div>\r\n<!-- Connector Arrow (Mobile) -->\r\n<span class=\"material-symbols-outlined text-outline-variant mt-sm lg:hidden\">arrow_downward</span>\r\n</div>\r\n<!-- Step 5: Kết quả -->\r\n<div class=\"flex-1 flex flex-col items-center group relative\">\r\n<div class=\"w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-xl flex flex-col items-center justify-center text-center shadow-sm hover:shadow-md hover:border-primary hover:-translate-y-1 transition-all duration-300 relative z-10 h-full min-h-[200px]\">\r\n<div class=\"absolute -top-4 -left-4 w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-title-lg text-title-lg shadow-sm\">5</div>\r\n<div class=\"w-16 h-16 rounded-full bg-surface-tint/20 flex items-center justify-center mb-md group-hover:bg-surface-tint transition-colors duration-300\">\r\n<span class=\"material-symbols-outlined text-surface-tint group-hover:text-on-primary text-[32px] transition-colors duration-300\" data-icon=\"analytics\" data-weight=\"fill\" style=\"font-variation-settings: 'FILL' 1;\">analytics</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface\">Kết quả</h3>\r\n<p class=\"font-label-sm text-label-sm text-primary mt-xs font-semibold\">(Checklist / Báo cáo)</p>\r\n</div>\r\n</div>\r\n</div>\r\n</div>\r\n</div>\r\n</main>\r\n<!-- Footer -->\r\n<footer class=\"bg-surface-container-low flex justify-between items-center w-full px-margin-desktop py-sm mt-auto relative z-20\">\r\n<div class=\"font-label-lg text-label-lg font-semibold text-on-surface\">Scaify</div>\r\n<div class=\"font-body-md text-body-md text-secondary\">© 2026 Scaify AI Intelligence.</div>\r\n<div class=\"flex gap-lg\">\r\n<a class=\"font-body-md text-body-md text-secondary hover:underline hover:text-primary transition-all duration-200\" href=\"#\">Pitch Deck</a>\r\n<a class=\"font-body-md text-body-md text-secondary hover:underline hover:text-primary transition-all duration-200\" href=\"#\">Team 072</a>\r\n</div>\r\n</footer>\r\n\r\n\r\n</body></html>"

ed-variant\": \"#392cbb\",\r\n                        \"surface-container\": \"#f0ecf8\",\r\n                        \"secondary\": \"#734aa4\",\r\n                        \"outline\": \"#777586\",\r\n                        \"on-tertiary-fixed-variant\": \"#13448d\"\r\n                    },\r\n                    \"borderRadius\": {\r\n                        \"DEFAULT\": \"0.25rem\",\r\n                        \"lg\": \"0.5rem\",\r\n                        \"xl\": \"0.75rem\",\r\n                        \"full\": \"9999px\"\r\n                    },\r\n                    \"spacing\": {\r\n                        \"margin-mobile\": \"16px\",\r\n                        \"2xl\": \"48px\",\r\n                        \"sm\": \"8px\",\r\n                        \"gutter\": \"24px\",\r\n                        \"md\": \"16px\",\r\n                        \"xs\": \"4px\",\r\n                        \"lg\": \"24px\",\r\n                        \"xl\": \"32px\",\r\n                        \"margin-desktop\": \"32px\",\r\n                        \"3xl\": \"64px\",\r\n                        \"base\": \"8px\"\r\n                    },\r\n                    \"fontFamily\": {\r\n                        \"headline-lg\": [\"Noto Sans\"],\r\n                        \"label-sm\": [\"Noto Sans\"],\r\n                        \"label-lg\": [\"Noto Sans\"],\r\n                        \"body-md\": [\"Noto Sans\"],\r\n                        \"body-lg\": [\"Noto Sans\"],\r\n                        \"title-lg\": [\"Noto Sans\"],\r\n                        \"display-lg\": [\"Noto Sans\"],\r\n                        \"headline-lg-mobile\": [\"Noto Sans\"]\r\n                    },\r\n                    \"fontSize\": {\r\n                        \"headline-lg\": [\"32px\", { \"lineHeight\": \"40px\", \"fontWeight\": \"400\" }],\r\n                        \"label-sm\": [\"11px\", { \"lineHeight\": \"16px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"500\" }],\r\n                        \"label-lg\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.1px\", \"fontWeight\": \"500\" }],\r\n                        \"body-md\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.25px\", \"fontWeight\": \"400\" }],\r\n                        \"body-lg\": [\"16px\", { \"lineHeight\": \"24px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"400\" }],\r\n                        \"title-lg\": [\"22px\", { \"lineHeight\": \"28px\", \"fontWeight\": \"500\" }],\r\n                        \"display-lg\": [\"57px\", { \"lineHeight\": \"64px\", \"letterSpacing\": \"-0.25px\", \"fontWeight\": \"400\" }],\r\n                        \"headline-lg-mobile\": [\"28px\", { \"lineHeight\": \"36px\", \"fontWeight\": \"400\" }]\r\n                    }\r\n                }\r\n            }\r\n        }\r\n    <\\/script>\r\n<style>\r\n        .material-symbols-outlined {\r\n            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;\r\n        }\r\n    </style>\r\n<style data-stitch-cursor=\"\"></style><style data-stitch-scroll-lock=\"\"></style></head>\r\n<body class=\"bg-background text-on-background min-h-screen flex flex-col\">\r\n<!-- TopAppBar -->\r\n<header class=\"bg-surface docked full-width top-0 flex justify-between items-center w-full px-margin-desktop py-md max-w-full z-50 relative\">\r\n<div class=\"flex items-center\"><img src=\"../assets/scaify-logo.png\" alt=\"Scaify Logo\" class=\"h-10 w-auto object-contain\"></div>\r\n<div class=\"flex items-center gap-md text-primary\">\r\n<button class=\"flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-70\">\r\n<span class=\"material-symbols-outlined text-2xl\">account_circle</span>\r\n</button>\r\n</div>\r\n</header>\r\n<!-- Main Content -->\r\n<main class=\"flex-grow w-full px-margin-mobile md:px-margin-desktop py-3xl md:py-2xl max-w-7xl mx-auto flex flex-col gap-3xl\">\r\n<!-- Header Section -->\r\n<section class=\"max-w-5xl\">\r\n<h1 class=\"font-headline-lg-mobile md:font-display-lg text-headline-lg-mobile md:text-display-lg text-on-surface mb-lg\">\r\n                Kiến trúc kỹ thuật <span class=\"text-primary font-bold\">vững chắc</span>\r\n</h1>\r\n<p class=\"font-body-lg text-body-lg text-on-surface-variant\">\r\n                Phần này trả lời một câu hỏi rất đơn giản: <strong>có hệ thống thật không?</strong> Scaify không phải một slide demo, mà là một luồng có thể truy vết, có log, có cảnh báo và có thể giải thích từng chỗ lệch theo rule minh bạch.\r\n            </p>\r\n</section>\r\n<!-- Proof Bento Grid -->\r\n<section>\r\n<h2 class=\"font-title-lg text-title-lg text-on-surface mb-xl border-b border-outline-variant pb-sm inline-block\">Bằng chứng vận hành</h2>\r\n<div class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-gutter\">\r\n<!-- Card 1: Traceability -->\r\n<div class=\"bg-surface-container-lowest border border-outline-variant rounded-xl p-lg hover:bg-surface-container-low hover:border-primary-fixed-dim transition-all duration-300 flex flex-col group shadow-sm\">\r\n<div class=\"w-12 h-12 rounded-lg bg-tertiary-fixed text-tertiary-container flex items-center justify-center mb-md group-hover:bg-primary-fixed group-hover:text-primary transition-colors\">\r\n<span class=\"material-symbols-outlined\" style=\"font-variation-settings: 'FILL' 1;\">fact_check</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-sm\">Traceability</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant flex-grow\">\r\n                        Mỗi kết quả đều có thể truy về file gốc, dòng dữ liệu và rule đã kích hoạt. Đây là điểm tạo niềm tin, không phải chỉ là giao diện.\r\n                    </p>\r\n</div>\r\n<!-- Card 2: Pipeline -->\r\n<div class=\"bg-surface-container-lowest border border-outline-variant rounded-xl p-lg hover:bg-surface-container-low hover:border-primary-fixed-dim transition-all duration-300 flex flex-col group shadow-sm\">\r\n<div class=\"w-12 h-12 rounded-lg bg-secondary-fixed text-on-secondary-container flex items-center justify-center mb-md group-hover:bg-primary-fixed group-hover:text-primary transition-colors\">\r\n<span class=\"material-symbols-outlined\" style=\"font-variation-settings: 'FILL' 1;\">swap_vert</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-sm\">Pipeline đối soát</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant flex-grow\">\r\n                        Luồng nhập CSV, đọc chứng từ, đối soát, cảnh báo và lưu hồ sơ đi theo một quy trình lặp lại được, không phụ thuộc vào thao tác tay.\r\n                    </p>\r\n</div>\r\n<!-- Card 3: Explainability -->\r\n<div class=\"bg-surface-container-lowest border border-outline-variant rounded-xl p-lg hover:bg-surface-container-low hover:border-primary-fixed-dim transition-all duration-300 flex flex-col group shadow-sm\">\r\n<div class=\"w-12 h-12 rounded-lg bg-error-container text-on-error-container flex items-center justify-center mb-md group-hover:bg-primary-fixed group-hover:text-primary transition-colors\">\r\n<span class=\"material-symbols-outlined\" style=\"font-variation-settings: 'FILL' 1;\">tips_and_updates</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-sm\">Explain Tax</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant flex-grow\">\r\n                        Khi có lệch, hệ thống không chỉ báo đỏ mà còn trả lời “vì sao” bằng rule và căn cứ pháp lý đã chuẩn bị sẵn.\r\n                    </p>\r\n</div>\r\n<!-- Card 4: Audit log -->\r\n<div class=\"bg-surface-container-lowest border border-outline-variant rounded-xl p-lg hover:bg-surface-container-low hover:border-primary-fixed-dim transition-all duration-300 flex flex-col group shadow-sm\">\r\n<div class=\"w-12 h-12 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center mb-md group-hover:bg-primary-fixed group-hover:text-primary transition-colors\">\r\n<span class=\"material-symbols-outlined\" style=\"font-variation-settings: 'FILL' 1;\">assignment</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-sm\">Audit log</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant flex-grow\">\r\n                        Mỗi kỳ lưu lại hồ sơ, trạng thái và phản hồi để người dùng có thể quay lại kiểm tra, thay vì đoán lại từ đầu.\r\n                    </p>\r\n</div>\r\n</div>\r\n</section>\r\n<!-- Key Strengths Section -->\r\n<section class=\"bg-surface-container rounded-xl p-lg md:p-xl border border-outline-variant\">\r\n<h2 class=\"font-title-lg text-title-lg text-on-surface mb-xl text-center\">Vì sao nhà đầu tư có thể tin Scaify?</h2>\r\n<div class=\"grid grid-cols-1 md:grid-cols-2 gap-xl\">\r\n<!-- Strength 1 -->\r\n<div class=\"flex gap-md\">\r\n<div class=\"flex-shrink-0 mt-1\">\r\n<div class=\"w-10 h-10 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm\">\r\n<span class=\"material-symbols-outlined text-xl\">fact_check</span>\r\n</div>\r\n</div>\r\n<div>\r\n<h4 class=\"font-title-lg text-title-lg text-on-surface mb-xs\">Khả năng truy xuất</h4>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">\r\n                            Mọi kết quả đều gắn với file gốc, dòng dữ liệu và rule kích hoạt. Người dùng kiểm chứng được ngay “vì sao” thay vì chỉ thấy một kết quả đen hộp.\r\n                        </p>\r\n</div>\r\n</div>\r\n<!-- Strength 2 -->\r\n<div class=\"flex gap-md\">\r\n<div class=\"flex-shrink-0 mt-1\">\r\n<div class=\"w-10 h-10 rounded-full bg-secondary flex items-center justify-center text-on-secondary shadow-sm\">\r\n<span class=\"material-symbols-outlined text-xl\">account_tree</span>\r\n</div>\r\n</div>\r\n<div>\r\n<h4 class=\"font-title-lg text-title-lg text-on-surface mb-xs\">Không đổi quy trình hiện tại</h4>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">\r\n                            Scaify đứng trước workflow hiện tại thay vì thay thế toàn bộ hệ thống. Người dùng vẫn làm cách quen thuộc, chỉ thêm một lớp kiểm chứng, giải thích và lưu hồ sơ theo kỳ.\r\n                        </p>\r\n</div>\r\n</div>\r\n</div>\r\n</section>\r\n</main>\r\n<!-- Footer -->\r\n<footer class=\"bg-surface-container-low flex justify-between items-center w-full px-margin-desktop py-sm mt-auto border-t border-outline-variant/30\">\r\n<div class=\"font-label-lg text-label-lg font-semibold text-on-surface\">\r\n            Scaify\r\n        </div>\r\n<div class=\"flex items-center gap-gutter\">\r\n<nav class=\"flex gap-md\">\r\n<a class=\"font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-all duration-200\" href=\"#\">Pitch Deck</a>\r\n<a class=\"font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-all duration-200\" href=\"#\">Team 072</a>\r\n</nav>\r\n<div class=\"font-label-sm text-label-sm text-secondary\">\r\n                © 2026 Scaify AI Intelligence.\r\n            </div>\r\n</div>\r\n</footer>\r\n\r\n\r\n</body></html>\r\n"

play-lg text-display-lg text-primary mb-md\">Thời điểm vàng của thị trường</h1>\r\n<p class=\"font-title-lg text-title-lg text-on-surface-variant\">3 lực đẩy chính định hình kỷ nguyên mới của doanh nghiệp.</p>\r\n</div>\r\n<!-- Asymmetric Bento Grid for 3 Forces -->\r\n<div class=\"grid grid-cols-1 md:grid-cols-12 gap-gutter w-full\">\r\n<!-- Force 1: Áp lực tuân thủ -->\r\n<div class=\"col-span-1 md:col-span-5 bg-surface-container-low rounded-xl overflow-hidden flex flex-col hover:bg-surface-container-high transition-colors duration-300\">\r\n<div class=\"h-48 w-full bg-surface-variant relative overflow-hidden\">\r\n<img alt=\"Compliance Concept\" class=\"w-full h-full object-cover mix-blend-overlay opacity-50\" data-alt=\"A highly abstract digital representation of legal compliance and corporate security. Glowing, structured geometric grids and shield motifs float in a bright, modern light-mode space. The color palette relies heavily on deep indigo, soft violet, and pristine white. The mood is authoritative, secure, and technologically advanced, conveying a sense of rigorous digital structure.\" src=\"https://lh3.googleusercontent.com/aida-public/AB6AXuD8lEkpBpAVgxhGZiHSQ4HVjWWVYaLpe66U2tJeAoI4biPVKsvFFKEJGsH4AlX9GkEK21QU5oSbrMwPIu-L93koN82a7mAKd5M3iCNDh0vwDG6V0J4Og2S12zWf7YJyE8osy3WSjCGWti9U-yN56aO2sgEdiFlyM0pAlfUBbBpDd1SS6iAA3olJqE9MBafcDOKxJF2IDZ6GZjojTfBG3W4PQNjYTPhfWarHA5T_KU3V_WgDuv-IgtPGFv9GEiirIwHP6ySR-pRkZAw\">\r\n<div class=\"absolute inset-0 bg-gradient-to-t from-surface-container-low to-transparent\"></div>\r\n<span class=\"material-symbols-outlined absolute bottom-md left-md text-primary text-4xl\" data-icon=\"gavel\" style=\"font-variation-settings: 'FILL' 1;\">gavel</span>\r\n</div>\r\n<div class=\"p-lg flex-grow flex flex-col justify-center\">\r\n<h2 class=\"font-title-lg text-title-lg text-on-surface mb-sm\">Áp lực tuân thủ</h2>\r\n<p class=\"font-body-lg text-body-lg text-on-surface-variant\">Các quy định pháp lý ngày càng thắt chặt đòi hỏi sự minh bạch và tốc độ xử lý tài liệu vượt trội từ mọi tổ chức.</p>\r\n</div>\r\n</div>\r\n<!-- Force 2: Dữ liệu phi cấu trúc -->\r\n<div class=\"col-span-1 md:col-span-7 bg-surface-container-low rounded-xl overflow-hidden flex flex-col hover:bg-surface-container-high transition-colors duration-300\">\r\n<div class=\"h-48 w-full bg-secondary-container relative overflow-hidden\">\r\n<img alt=\"Data Structure Concept\" class=\"w-full h-full object-cover mix-blend-overlay opacity-60\" data-alt=\"A striking data visualization abstract art piece. Chaotic, scattered light particles dynamically organize themselves into structured, readable graphs and networks across a luminous white background. The elements utilize a modern corporate palette of vibrant primary indigo and soft secondary violet tones. The aesthetic is clean, analytical, and highly sophisticated, illustrating order emerging from chaos.\" src=\"https://lh3.googleusercontent.com/aida-public/AB6AXuAOxo9N-DkgZn5PvUF0Y8sH0gLJ8sy4cRoWqpDAZHmgZjtySXX43dttfaMVqDB9LDrB-Ytd7oHWnhi5R2O0Icv169UaoJRzzUsHMzMHwN6fi5rKQ5gKOVq13zaRrkTpt_1ZxQgzlI3jka3nVICYJMXPss0gyw2SZtCkMiU5MN39ZkNaFtlIjDwGRGTYE7Sb4NBJ49DfqCITWxkpHV2UGsVnRdgi9-e0Ea5_QMdnsKXRmnsaToFIJFNz-UuGxeTNkD5qsyaYo83qedM\">\r\n<div class=\"absolute inset-0 bg-gradient-to-t from-surface-container-low to-transparent\"></div>\r\n<span class=\"material-symbols-outlined absolute bottom-md left-md text-on-secondary-container text-4xl\" data-icon=\"dataset\" style=\"font-variation-settings: 'FILL' 1;\">dataset</span>\r\n</div>\r\n<div class=\"p-lg flex-grow flex flex-col justify-center\">\r\n<h2 class=\"font-title-lg text-title-lg text-on-surface mb-sm\">Dữ liệu phi cấu trúc</h2>\r\n<p class=\"font-body-lg text-body-lg text-on-surface-variant\">Hơn 80% dữ liệu doanh nghiệp tồn tại dưới dạng văn bản, hình ảnh, email chưa được khai thác. Khả năng giải mã kho báu này quyết định lợi thế cạnh tranh.</p>\r\n</div>\r\n</div>\r\n<!-- Force 3: AI đã đủ rẻ -->\r\n<div class=\"col-span-1 md:col-span-12 bg-surface-container-highest rounded-xl overflow-hidden relative flex flex-col md:flex-row items-center hover:bg-surface-variant transition-colors duration-300\">\r\n<div class=\"w-full md:w-1/2 p-xl z-10\">\r\n<span class=\"material-symbols-outlined text-primary text-5xl mb-md\" data-icon=\"memory\" style=\"font-variation-settings: 'FILL' 1;\">memory</span>\r\n<h2 class=\"font-title-lg text-title-lg text-on-surface mb-md\">AI đã đủ rẻ</h2>\r\n<p class=\"font-body-lg text-body-lg text-on-surface-variant\">Chi phí tính toán và truy cập các mô hình ngôn ngữ lớn (LLMs) đã giảm theo cấp số nhân, biến AI từ một công nghệ phòng thí nghiệm thành công cụ phổ thông, hiệu quả về chi phí cho mọi quy mô doanh nghiệp.</p>\r\n</div>\r\n<div class=\"w-full md:w-1/2 h-64 md:h-full relative overflow-hidden hidden md:block\">\r\n<img alt=\"AI Technology Concept\" class=\"absolute inset-0 w-full h-full object-cover mix-blend-multiply opacity-30\" data-alt=\"A sleek, futuristic visualization of accessible AI technology. Close-up of glowing, intricate microchip pathways and crystalline processing nodes emitting a soft, cool light against a stark white, modern laboratory background. The dominant colors are sharp indigo and bright white, conveying an aesthetic of high-tech efficiency, democratization of technology, and clean corporate modernism.\" src=\"https://lh3.googleusercontent.com/aida-public/AB6AXuD16Hjk4ga4psQO2awoH7ukg7qr9MEOCnZFc834O028Do9C7Te8pphjOBON6OIKEempY-Ku7fiVwNNo0o3GEGrgfilja3KmPNehsNjd-0nTitFQw0ptp4O5fVEGR_x4fRV_oJvtdP0_SN4dnnqH-sNwFvbUYYJ1h1nf_6T_C9SLHUs0F4MlDfOMDtIRz8q8Cn1b7P7FjKShhZhN5K3qfaYYx6BN4W3I8iQ470JkgnyQz82mTAJMWh77m6IBkomjEi_6qj2Pb3aAnk4\">\r\n<div class=\"absolute inset-0 bg-gradient-to-r from-surface-container-highest to-transparent\"></div>\r\n</div>\r\n</div>\r\n</div>\r\n</main>\r\n<!-- Footer Shared Component -->\r\n<footer class=\"bg-surface-container-low dark:bg-inverse-surface text-secondary dark:text-secondary-fixed-dim font-body-md text-body-md docked full-width bottom-0 flat no shadows flex justify-between items-center w-full px-margin-desktop py-sm mt-auto z-40\">\r\n<div class=\"font-label-lg text-label-lg font-semibold text-on-surface dark:text-surface-lowest\">\r\n            © 2026 Scaify AI Intelligence. \r\n        </div>\r\n<div class=\"flex gap-lg\">\r\n<a class=\"font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant hover:underline hover:text-primary dark:hover:text-primary-fixed-dim transition-all duration-200\" href=\"#\">Pitch Deck</a>\r\n<a class=\"font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant hover:underline hover:text-primary dark:hover:text-primary-fixed-dim transition-all duration-200\" href=\"#\">Team 072</a>\r\n</div>\r\n</footer>\r\n\r\n\r\n</body></html>"
