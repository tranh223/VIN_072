    "html": "<!DOCTYPE html><html lang=\"vi\"><head>\n<base href=\"file:///C:/AI%20VinUni/A20-App-072/docs/scaify_ai_pitch_deck/slides/\">\r\n<meta charset=\"utf-8\">\r\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\">\r\n<title>Scaify - Thị trường &amp; Moat</title>\r\n<script src=\"https://cdn.tailwindcss.com?plugins=forms,container-queries\"><\\/script>\r\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap\" rel=\"stylesheet\">\r\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\">\r\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\">\r\n<script id=\"tailwind-config\">\r\n      tailwind.config = {\r\n        darkMode: \"class\",\r\n        theme: {\r\n          extend: {\r\n            \"colors\": {\r\n                    \"surface\": \"#fcf8ff\",\r\n                    \"surface-tint\": \"#5249d3\",\r\n                    \"outline-variant\": \"#CBC3D6\",\r\n                    \"inverse-on-surface\": \"#f3effb\",\r\n                    \"surface-container-lowest\": \"#ffffff\",\r\n                    \"background\": \"#fcf8ff\",\r\n                    \"on-secondary\": \"#ffffff\",\r\n                    \"on-surface\": \"#1b1b23\",\r\n                    \"on-tertiary-container\": \"#a4c1ff\",\r\n                    \"on-primary\": \"#ffffff\",\r\n                    \"primary-container\": \"#4136c3\",\r\n                    \"on-tertiary\": \"#ffffff\",\r\n                    \"on-secondary-fixed\": \"#2a0053\",\r\n                    \"primary\": \"#2812ad\",\r\n                    \"secondary-fixed-dim\": \"#dab9ff\",\r\n                    \"tertiary-fixed-dim\": \"#adc6ff\",\r\n                    \"surface-dim\": \"#dcd8e4\",\r\n                    \"secondary-container\": \"#c99dfe\",\r\n                    \"inverse-surface\": \"#302f38\",\r\n                    \"tertiary\": \"#003578\",\r\n                    \"surface-container-highest\": \"#e4e1ed\",\r\n                    \"surface-container-high\": \"#eae6f2\",\r\n                    \"surface-highest\": \"#E2E2E2\",\r\n                    \"primary-fixed-dim\": \"#c3c0ff\",\r\n                    \"on-primary-fixed\": \"#100069\",\r\n                    \"on-background\": \"#1b1b23\",\r\n                    \"on-secondary-container\": \"#572d87\",\r\n                    \"on-tertiary-fixed\": \"#001a41\",\r\n                    \"error-container\": \"#ffdad6\",\r\n                    \"on-error-container\": \"#93000a\",\r\n                    \"surface-lowest\": \"#FFFFFF\",\r\n                    \"on-primary-container\": \"#bdb9ff\",\r\n                    \"tertiary-fixed\": \"#d8e2ff\",\r\n                    \"on-surface-variant\": \"#464554\",\r\n                    \"on-error\": \"#ffffff\",\r\n                    \"surface-bright\": \"#fcf8ff\",\r\n                    \"error\": \"#BA1A1A\",\r\n                    \"on-secondary-fixed-variant\": \"#5a318a\",\r\n                    \"surface-container-low\": \"#f6f2fe\",\r\n                    \"tertiary-container\": \"#204d95\",\r\n                    \"inverse-primary\": \"#c3c0ff\",\r\n                    \"secondary-fixed\": \"#eedbff\",\r\n                    \"primary-fixed\": \"#E9DDFF\",\r\n                    \"surface-variant\": \"#e4e1ed\",\r\n                    \"on-primary-fixed-variant\": \"#392cbb\",\r\n                    \"surface-container\": \"#f0ecf8\",\r\n                    \"secondary\": \"#734aa4\",\r\n                    \"outline\": \"#777586\",\r\n                    \"on-tertiary-fixed-variant\": \"#13448d\"\r\n            },\r\n            \"borderRadius\": {\r\n                    \"DEFAULT\": \"0.25rem\",\r\n                    \"lg\": \"0.5rem\",\r\n                    \"xl\": \"0.75rem\",\r\n                    \"full\": \"9999px\"\r\n            },\r\n            \"spacing\": {\r\n                    \"margin-mobile\": \"16px\",\r\n                    \"2xl\": \"48px\",\r\n                    \"sm\": \"8px\",\r\n                    \"gutter\": \"24px\",\r\n                    \"md\": \"16px\",\r\n                    \"xs\": \"4px\",\r\n                    \"lg\": \"24px\",\r\n                    \"xl\": \"32px\",\r\n                    \"margin-desktop\": \"32px\",\r\n                    \"3xl\": \"64px\",\r\n                    \"base\": \"8px\"\r\n            },\r\n            \"fontFamily\": {\r\n                    \"headline-lg\": [\"Noto Sans\"],\r\n                    \"label-sm\": [\"Noto Sans\"],\r\n                    \"label-lg\": [\"Noto Sans\"],\r\n                    \"body-md\": [\"Noto Sans\"],\r\n                    \"body-lg\": [\"Noto Sans\"],\r\n                    \"title-lg\": [\"Noto Sans\"],\r\n                    \"display-lg\": [\"Noto Sans\"],\r\n                    \"headline-lg-mobile\": [\"Noto Sans\"]\r\n            },\r\n            \"fontSize\": {\r\n                    \"headline-lg\": [\"32px\", { \"lineHeight\": \"40px\", \"fontWeight\": \"400\" }],\r\n                    \"label-sm\": [\"11px\", { \"lineHeight\": \"16px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"500\" }],\r\n                    \"label-lg\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.1px\", \"fontWeight\": \"500\" }],\r\n                    \"body-md\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.25px\", \"fontWeight\": \"400\" }],\r\n                    \"body-lg\": [\"16px\", { \"lineHeight\": \"24px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"400\" }],\r\n                    \"title-lg\": [\"22px\", { \"lineHeight\": \"28px\", \"fontWeight\": \"500\" }],\r\n                    \"display-lg\": [\"57px\", { \"lineHeight\": \"64px\", \"letterSpacing\": \"-0.25px\", \"fontWeight\": \"400\" }],\r\n                    \"headline-lg-mobile\": [\"28px\", { \"lineHeight\": \"36px\", \"fontWeight\": \"400\" }]\r\n            }\r\n          }\r\n        }\r\n      }\r\n    <\\/script>\r\n<style>\r\n        .material-symbols-outlined {\r\n            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;\r\n        }\r\n        .icon-fill {\r\n            font-variation-settings: 'FILL' 1;\r\n        }\r\n    </style>\r\n<style data-stitch-cursor=\"\"></style><style data-stitch-scroll-lock=\"\"></style></head>\r\n<body class=\"bg-background text-on-background min-h-screen flex flex-col antialiased\">\r\n<!-- TopAppBar -->\r\n<header class=\"bg-surface dark:bg-on-surface docked full-width top-0 flat no shadows flex justify-between items-center w-full px-margin-desktop py-md max-w-full sticky z-50\">\r\n<div class=\"font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed-dim\"><img src=\"../assets/scaify-logo.png\" alt=\"Scaify Logo\" class=\"h-8 md:h-10 w-auto object-contain\"></div>\r\n<div class=\"flex items-center gap-md\">\r\n<button class=\"text-primary dark:text-primary-fixed-dim cursor-pointer transition-opacity active:opacity-70 hover:text-primary-container dark:hover:text-primary-fixed-dim transition-colors flex items-center justify-center p-sm rounded-full hover:bg-surface-container-low\">\r\n<span class=\"material-symbols-outlined text-2xl\" data-icon=\"account_circle\">account_circle</span>\r\n</button>\r\n</div>\r\n</header>\r\n<!-- Main Content Canvas -->\r\n<main class=\"flex-grow px-margin-mobile md:px-margin-desktop py-xl max-w-7xl mx-auto w-full\">\r\n<!-- Header Section -->\r\n<div class=\"mb-xl text-center md:text-left\">\r\n<h1 class=\"font-display-lg text-display-lg text-primary mb-sm\">Thị trường đủ lớn để bắt đầu nhỏ</h1>\r\n<p class=\"font-title-lg text-body-lg text-on-surface-variant max-w-3xl\">Scaify không cần ôm toàn bộ kế toán. Chúng tôi chọn một lát cắt cụ thể: người bán online tự ghi CSV cần đối soát, giải thích và lưu hồ sơ theo kỳ. <strong>Tệp này đủ lớn để bắt đầu từ một nhóm hẹp rồi mở rộng dần sang hàng nghìn workspace.</strong></p>\r\n</div>\r\n<!-- Bento Grid Layout for Market Comparison -->\r\n<div class=\"grid grid-cols-1 md:grid-cols-12 gap-gutter\">\r\n<!-- Core Differentiator Highlight (RAG Bot) -->\r\n<div class=\"md:col-span-12 lg:col-span-8 bg-primary text-on-primary rounded-xl p-xl shadow-md relative overflow-hidden flex flex-col justify-center min-h-[300px]\">\r\n<div class=\"absolute top-0 right-0 w-64 h-64 bg-primary-container rounded-full blur-3xl opacity-50 -mr-20 -mt-20\"></div>\r\n<div class=\"relative z-10\">\r\n<div class=\"flex items-center gap-md mb-md\">\r\n<span class=\"material-symbols-outlined icon-fill text-4xl text-tertiary-fixed-dim\">smart_toy</span>\r\n<h2 class=\"font-headline-lg text-headline-lg font-bold\">Lớp đối soát chuyên biệt</h2>\r\n</div>\r\n<p class=\"font-body-lg text-body-lg mb-lg max-w-2xl text-primary-fixed\">Điểm mạnh của Scaify không nằm ở việc làm thay toàn bộ kế toán, mà ở chỗ giải đúng một bài toán rất lặp lại: khớp CSV tự ghi với chứng từ, chỉ ra lệch, giải thích vì sao và lưu lại hồ sơ theo kỳ.</p>\r\n<div class=\"flex flex-wrap gap-sm\">\r\n<span class=\"bg-primary-container text-on-primary-container font-label-lg text-label-lg px-md py-sm rounded-full border border-primary-fixed-dim/30\">Tệp khách đủ lớn</span>\r\n<span class=\"bg-primary-container text-on-primary-container font-label-lg text-label-lg px-md py-sm rounded-full border border-primary-fixed-dim/30\">Workflow lặp lại theo kỳ</span>\r\n<span class=\"bg-primary-container text-on-primary-container font-label-lg text-label-lg px-md py-sm rounded-full border border-primary-fixed-dim/30\">Giải thích có căn cứ</span>\r\n</div>\r\n</div>\r\n</div>\r\n<!-- The Legacy Problem (Excel) -->\r\n<div class=\"md:col-span-6 lg:col-span-4 bg-surface-container-low border border-outline-variant rounded-xl p-lg flex flex-col transition-all hover:bg-surface-container-high hover:shadow-sm group\">\r\n<div class=\"mb-md flex items-center justify-between\">\r\n<div class=\"flex items-center gap-sm\">\r\n<span class=\"material-symbols-outlined text-error\">table_view</span>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface font-semibold\">Excel / Sheet</h3>\r\n</div>\r\n<span class=\"bg-surface-container text-on-surface-variant font-label-sm text-label-sm px-sm py-xs rounded\">Truyền thống</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mb-md flex-grow\">Linh hoạt nhưng phụ thuộc thao tác tay, khó truy vết và dễ lệch khi dữ liệu nằm ở nhiều file khác nhau.</p>\r\n<div class=\"border-t border-outline-variant/50 pt-md mt-auto\">\r\n<div class=\"flex items-center gap-sm text-error mb-xs\">\r\n<span class=\"material-symbols-outlined text-sm\">close</span>\r\n<span class=\"font-body-md text-body-md\">Dò tay từng file</span>\r\n</div>\r\n<div class=\"flex items-center gap-sm text-error\">\r\n<span class=\"material-symbols-outlined text-sm\">close</span>\r\n<span class=\"font-body-md text-body-md\">Khó giải trình vì sao</span>\r\n</div>\r\n</div>\r\n</div>\r\n<!-- Existing Tools (POS) -->\r\n<div class=\"md:col-span-6 lg:col-span-4 bg-surface-container-low border border-outline-variant rounded-xl p-lg flex flex-col transition-all hover:bg-surface-container-high hover:shadow-sm\">\r\n<div class=\"mb-md flex items-center justify-between\">\r\n<div class=\"flex items-center gap-sm\">\r\n<span class=\"material-symbols-outlined text-tertiary\">point_of_sale</span>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface font-semibold\">POS / sàn</h3>\r\n</div>\r\n<span class=\"bg-surface-container text-on-surface-variant font-label-sm text-label-sm px-sm py-xs rounded\">Bán hàng</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mb-md flex-grow\">Mạnh về bán hàng, nhưng không giải bài toán đối soát chứng từ của người bán kênh không settlement.</p>\r\n<div class=\"border-t border-outline-variant/50 pt-md mt-auto\">\r\n<div class=\"flex items-center gap-sm text-secondary mb-xs\">\r\n<span class=\"material-symbols-outlined text-sm\">check</span>\r\n<span class=\"font-body-md text-body-md\">Vận hành bán hàng tốt</span>\r\n</div>\r\n<div class=\"flex items-center gap-sm text-error\">\r\n<span class=\"material-symbols-outlined text-sm\">close</span>\r\n<span class=\"font-body-md text-body-md\">Thiếu lớp giải thích</span>\r\n</div>\r\n</div>\r\n</div>\r\n<!-- Existing Tools (Accounting) -->\r\n<div class=\"md:col-span-6 lg:col-span-4 bg-surface-container-low border border-outline-variant rounded-xl p-lg flex flex-col transition-all hover:bg-surface-container-high hover:shadow-sm\">\r\n<div class=\"mb-md flex items-center justify-between\">\r\n<div class=\"flex items-center gap-sm\">\r\n<span class=\"material-symbols-outlined text-secondary\">account_balance</span>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface font-semibold\">Kế toán trọn gói</h3>\r\n</div>\r\n<span class=\"bg-surface-container text-on-surface-variant font-label-sm text-label-sm px-sm py-xs rounded\">Nghiệp vụ</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mb-md flex-grow\">Mạnh về nghiệp vụ kế toán, nhưng không phải lớp mỏng chuyên để người bán online tự kiểm chứng dữ liệu trước kỳ thuế.</p>\r\n<div class=\"border-t border-outline-variant/50 pt-md mt-auto\">\r\n<div class=\"flex items-center gap-sm text-secondary mb-xs\">\r\n<span class=\"material-symbols-outlined text-sm\">check</span>\r\n<span class=\"font-body-md text-body-md\">Chuẩn nghiệp vụ</span>\r\n</div>\r\n<div class=\"flex items-center gap-sm text-error\">\r\n<span class=\"material-symbols-outlined text-sm\">close</span>\r\n<span class=\"font-body-md text-body-md\">Không tối ưu cho tự đối soát</span>\r\n</div>\r\n</div>\r\n</div>\r\n<!-- The Scaify Advantage Summary -->\r\n<div class=\"md:col-span-6 lg:col-span-4 bg-surface-container border border-primary/20 rounded-xl p-lg flex flex-col justify-center relative overflow-hidden\">\r\n<div class=\"absolute inset-0 bg-gradient-to-br from-surface-container to-surface-container-high opacity-50\"></div>\r\n<div class=\"relative z-10 text-center\">\r\n<div class=\"w-16 h-16 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mx-auto mb-md\">\r\n<span class=\"material-symbols-outlined text-3xl icon-fill\">analytics</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-primary font-semibold mb-sm\">Scaify: Nền tảng Thế hệ mới</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">Scaify là workflow đối soát theo kỳ, dữ liệu chứng từ tích lũy, và lớp giải thích có căn cứ pháp lý.</p>\r\n</div>\r\n</div>\r\n</div>\r\n</main>\r\n<!-- Footer -->\r\n<footer class=\"bg-surface-container-low dark:bg-inverse-surface flat no shadows flex justify-between items-center w-full px-margin-desktop py-sm fixed bottom-0 left-0 z-50\">\r\n<div class=\"font-label-lg text-label-lg font-semibold text-on-surface dark:text-surface-lowest\">Scaify</div>\r\n<div class=\"flex gap-lg\">\r\n<span class=\"font-label-sm text-label-sm text-secondary dark:text-secondary-fixed-dim\">©2026 Scaify AI Intelligence.</span>\r\n<a class=\"font-body-md text-body-md text-on-surface-variant dark:text-outline-variant hover:underline hover:text-primary dark:hover:text-primary-fixed-dim transition-all duration-200\" href=\"#\">Pitch Deck</a>\r\n<a class=\"font-body-md text-body-md text-on-surface-variant dark:text-outline-variant hover:underline hover:text-primary dark:hover:text-primary-fixed-dim transition-all duration-200\" href=\"#\">Team 072</a>\r\n</div>\r\n</footer>\r\n\r\n\r\n</body></html>\r\n"

eight\": \"500\" }],\r\n                        \"label-lg\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.1px\", \"fontWeight\": \"500\" }],\r\n                        \"body-md\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.25px\", \"fontWeight\": \"400\" }],\r\n                        \"body-lg\": [\"16px\", { \"lineHeight\": \"24px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"400\" }],\r\n                        \"title-lg\": [\"22px\", { \"lineHeight\": \"28px\", \"fontWeight\": \"500\" }],\r\n                        \"display-lg\": [\"57px\", { \"lineHeight\": \"64px\", \"letterSpacing\": \"-0.25px\", \"fontWeight\": \"400\" }],\r\n                        \"headline-lg-mobile\": [\"28px\", { \"lineHeight\": \"36px\", \"fontWeight\": \"400\" }]\r\n                    }\r\n                }\r\n            }\r\n        }\r\n    <\\/script>\r\n<style data-stitch-cursor=\"\"></style><style data-stitch-scroll-lock=\"\"></style></head>\r\n<body class=\"bg-background text-on-surface min-h-screen flex flex-col pt-header-height pb-footer-height relative font-body-md text-body-md\">\r\n<!-- TopAppBar -->\r\n<header class=\"bg-surface flex justify-between items-center w-full px-margin-desktop py-md max-w-full fixed top-0 left-0 right-0 z-50 h-header-height shadow-[0_1px_2px_0_rgba(0,0,0,0.05)]\">\r\n<div class=\"font-headline-lg text-headline-lg font-bold text-primary\"><img src=\"../assets/scaify-logo.png\" alt=\"Scaify Logo\" class=\"h-9 w-auto object-contain\"></div>\r\n<div class=\"flex items-center gap-md\">\r\n<button class=\"cursor-pointer transition-opacity active:opacity-70 hover:text-primary-container text-primary flex items-center justify-center p-sm rounded-full hover:bg-surface-container-high transition-colors\">\r\n<span class=\"material-symbols-outlined\" style=\"font-variation-settings: 'FILL' 0;\">account_circle</span>\r\n</button>\r\n</div>\r\n</header>\r\n<!-- Main Content Area -->\r\n<main class=\"flex-grow w-full max-w-7xl mx-auto px-margin-desktop py-3xl flex flex-col gap-3xl\">\r\n<!-- Header Section -->\r\n<section class=\"flex flex-col items-start gap-sm max-w-5xl\">\r\n<!-- <div class=\"inline-flex items-center justify-center px-md py-sm rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-lg text-label-lg mb-sm\">\r\n                Slide 8: Mô hình kinh doanh\r\n            </div> -->\r\n<h1 class=\"font-display-lg text-display-lg text-on-surface font tracking-tight leading-tight\">\r\n                Ai trả tiền, và vì sao?\r\n            </h1>\r\n<p class=\"font-body-lg text-body-lg text-on-surface-variant mt-md max-w-2xl\">\r\n                Scaify ưu tiên một tệp khách hàng chính: người bán online tự ghi CSV. Freemium trước, subscription sau, workspace + API là nhánh mở rộng khi workflow lõi đã chứng minh được nhu cầu.\r\n            </p>\r\n</section>\r\n<!-- Customer Segments: Bento Grid -->\r\n<section class=\"flex flex-col gap-xl\">\r\n<h2 class=\"font-headline-lg text-headline-lg text-on-surface\">Tệp khách hàng ưu tiên</h2>\r\n<div class=\"grid grid-cols-1 md:grid-cols-2 gap-gutter\">\r\n<!-- Segment 1 -->\r\n<div class=\"group bg-surface-container-low rounded-3xl p-2xl border border-outline-variant hover:border-primary-fixed-dim transition-all duration-300 hover:shadow-lg hover:shadow-primary/5 flex flex-col gap-lg relative overflow-hidden\">\r\n<div class=\"absolute -right-12 -top-12 w-48 h-48 bg-secondary-container/30 rounded-full blur-3xl group-hover:bg-secondary-container/50 transition-colors\"></div>\r\n<div class=\"w-16 h-16 rounded-2xl bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed shadow-sm\">\r\n<span class=\"material-symbols-outlined text-[32px]\" style=\"font-variation-settings: 'FILL' 1;\">domain</span>\r\n</div>\r\n<div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-sm\">Người bán online tự ghi chép</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">\r\n                            Đây là nhóm có pain rõ nhất: CSV tự ghi, chứng từ rải rác, và nhu cầu đối soát lặp lại theo kỳ. Đây là nơi Scaify tạo giá trị đầu tiên.\r\n                        </p>\r\n</div>\r\n<div class=\"mt-auto pt-md border-t border-outline-variant/50\">\r\n<ul class=\"flex flex-col gap-sm\">\r\n<li class=\"flex items-center gap-sm text-on-surface-variant font-body-md text-body-md\">\r\n<span class=\"material-symbols-outlined text-secondary text-[18px]\">check_circle</span> Pain rõ và lặp lại\r\n                            </li>\r\n<li class=\"flex items-center gap-sm text-on-surface-variant font-body-md text-body-md\">\r\n<span class=\"material-symbols-outlined text-secondary text-[18px]\">check_circle</span> Dễ chứng minh giá trị\r\n                            </li>\r\n</ul>\r\n</div>\r\n</div>\r\n<!-- Segment 2 -->\r\n<div class=\"group bg-surface-container-low rounded-3xl p-2xl border border-outline-variant hover:border-primary-fixed-dim transition-all duration-300 hover:shadow-lg hover:shadow-primary/5 flex flex-col gap-lg relative overflow-hidden\">\r\n<div class=\"absolute -right-12 -top-12 w-48 h-48 bg-primary-container/20 rounded-full blur-3xl group-hover:bg-primary-container/40 transition-colors\"></div>\r\n<div class=\"w-16 h-16 rounded-2xl bg-primary-fixed flex items-center justify-center text-on-primary-fixed shadow-sm\">\r\n<span class=\"material-symbols-outlined text-[32px]\" style=\"font-variation-settings: 'FILL' 1;\">storefront</span>\r\n</div>\r\n<div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-sm\">Workspace + API sau này</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">\r\n                            Nhóm này là nhánh mở rộng sau pilot lõi. Khi workflow chính đã chứng minh được nhu cầu, Scaify mới mở workspace cho nhiều shop và API tích hợp.\r\n                        </p>\r\n</div>\r\n<div class=\"mt-auto pt-md border-t border-outline-variant/50\">\r\n<ul class=\"flex flex-col gap-sm\">\r\n<li class=\"flex items-center gap-sm text-on-surface-variant font-body-md text-body-md\">\r\n<span class=\"material-symbols-outlined text-primary text-[18px]\">check_circle</span> Mở rộng doanh thu\r\n                            </li>\r\n<li class=\"flex items-center gap-sm text-on-surface-variant font-body-md text-body-md\">\r\n<span class=\"material-symbols-outlined text-primary text-[18px]\">check_circle</span> Khai thác sau pilot\r\n                            </li>\r\n</ul>\r\n</div>\r\n</div>\r\n</div>\r\n</section>\r\n<!-- Pricing Model: Cards -->\r\n<section class=\"flex flex-col gap-xl\">\r\n<h2 class=\"font-headline-lg text-headline-lg text-on-surface text-center mb-md\">Mô hình thu tiền</h2>\r\n<div class=\"grid grid-cols-1 lg:grid-cols-3 gap-gutter items-end\">\r\n<!-- Plan 1: Freemium -->\r\n<div class=\"bg-surface-container-lowest rounded-3xl p-xl border border-outline-variant flex flex-col gap-lg pb-2xl\">\r\n<div>\r\n<div class=\"font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider mb-sm\">Mở đầu</div>\r\n<h3 class=\"font-display-lg text-display-lg text-on-surface font-semibold\">Freemium</h3>\r\n<div class=\"font-body-md text-body-md text-on-surface-variant mt-sm\">Dùng để cho người dùng thử workflow lõi trước khi mua gói trả phí.</div>\r\n</div>\r\n<div class=\"my-md\">\r\n<span class=\"font-headline-lg text-headline-lg text-on-surface font-bold\">0đ</span>\r\n<span class=\"font-body-md text-body-md text-on-surface-variant\">/tháng</span>\r\n</div>\r\n<ul class=\"flex flex-col gap-md mb-xl flex-grow\">\r\n<li class=\"flex items-start gap-sm\">\r\n<span class=\"material-symbols-outlined text-outline mt-[2px] text-[20px]\">check</span>\r\n<span class=\"font-body-md text-body-md text-on-surface\">Giới hạn số kỳ hoặc số file</span>\r\n</li>\r\n<li class=\"flex items-start gap-sm\">\r\n<span class=\"material-symbols-outlined text-outline mt-[2px] text-[20px]\">check</span>\r\n<span class=\"font-body-md text-body-md text-on-surface\">Trải nghiệm đối soát cơ bản</span>\r\n</li>\r\n<li class=\"flex items-start gap-sm\">\r\n<span class=\"material-symbols-outlined text-outline mt-[2px] text-[20px]\">check</span>\r\n<span class=\"font-body-md text-body-md text-on-surface\">Nhìn thấy giá trị trước khi trả tiền</span>\r\n</li>\r\n</ul>\r\n<button class=\"w-full py-md px-lg rounded-full border border-outline text-primary font-label-lg text-label-lg hover:bg-surface-container-low transition-colors\">\r\n                        Bắt đầu miễn phí\r\n                    </button>\r\n</div>\r\n<!-- Plan 2: Subscription (Highlighted) -->\r\n<div class=\"bg-primary-container rounded-3xl p-xl border-2 border-primary flex flex-col gap-lg shadow-xl shadow-primary/10 relative transform lg:-translate-y-4 pb-2xl\">\r\n<div class=\"absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-primary text-on-primary px-lg py-sm rounded-full font-label-sm text-label-sm uppercase tracking-wider font-bold shadow-md\">\r\n                        Phổ biến nhất\r\n                    </div>\r\n<div>\r\n<div class=\"font-label-lg text-label-lg text-on-primary-container/80 uppercase tracking-wider mb-sm\">Trả phí chính</div>\r\n<h3 class=\"font-display-lg text-display-lg text-on-primary-container font-semibold\">Subscription</h3>\r\n<div class=\"font-body-md text-body-md text-on-primary-container/90 mt-sm\">Dành cho người bán tự ghi CSV đã thấy rõ giá trị của đối soát và giải thích.</div>\r\n</div>\r\n<div class=\"my-md\">\r\n<span class=\"font-headline-lg text-headline-lg text-on-primary-container font-bold\">299k</span>\r\n<span class=\"font-body-md text-body-md text-on-primary-container/80\">/tháng</span>\r\n</div>\r\n<ul class=\"flex flex-col gap-md mb-xl flex-grow\">\r\n<li class=\"flex items-start gap-sm\">\r\n<span class=\"material-symbols-outlined text-primary-fixed mt-[2px] text-[20px]\">check_circle</span>\r\n<span class=\"font-body-md text-body-md text-on-primary-container font-medium\">Không giới hạn kỳ đối soát</span>\r\n</li>\r\n<li class=\"flex items-start gap-sm\">\r\n<span class=\"material-symbols-outlined text-primary-fixed mt-[2px] text-[20px]\">check_circle</span>\r\n<span class=\"font-body-md text-body-md text-on-primary-container\">Đối soát CSV ↔ chứng từ</span>\r\n</li>\r\n<li class=\"flex items-start gap-sm\">\r\n<span class=\"material-symbols-outlined text-primary-fixed mt-[2px] text-[20px]\">check_circle</span>\r\n<span class=\"font-body-md text-body-md text-on-primary-container\">Explain Tax và hồ sơ theo kỳ</span>\r\n</li>\r\n<li class=\"flex items-start gap-sm\">\r\n<span class=\"material-symbols-outlined text-primary-fixed mt-[2px] text-[20px]\">check_circle</span>\r\n<span class=\"font-body-md text-body-md text-on-primary-container\">Hỗ trợ pilot theo giai đoạn</span>\r\n</li>\r\n</ul>\r\n<button class=\"w-full py-md px-lg rounded-full bg-primary text-on-primary font-label-lg text-label-lg hover:bg-primary/90 transition-colors shadow-md\">\r\n                        Nâng cấp ngay\r\n                    </button>\r\n</div>\r\n<!-- Plan 3: Agency Plan -->\r\n<div class=\"bg-surface-container-low rounded-3xl p-xl border border-outline-variant flex flex-col gap-lg pb-2xl\">\r\n<div>\r\n<div class=\"font-label-lg text-label-lg text-secondary uppercase tracking-wider mb-sm\">Sau này</div>\r\n<h3 class=\"font-display-lg text-display-lg text-on-surface font-semibold\">Agency</h3>\r\n<div class=\"font-body-md text-body-md text-on-surface-variant mt-sm\">Chỉ mở khi workflow lõi đã chứng minh được nhu cầu rõ ràng ở nhóm chính.</div>\r\n</div>\r\n<div class=\"my-md\">\r\n<span class=\"font-headline-lg text-headline-lg text-on-surface font-bold\">Tùy chỉnh</span>\r\n<span class=\"font-body-md text-body-md text-on-surface-variant hidden\">/tháng</span>\r\n</div>\r\n<ul class=\"flex flex-col gap-md mb-xl flex-grow\">\r\n<li class=\"flex items-start gap-sm\">\r\n<span class=\"material-symbols-outlined text-secondary mt-[2px] text-[20px]\">business_center</span>\r\n<span class=\"font-body-md text-body-md text-on-surface\">Gói agency đa shop</span>\r\n</li>\r\n<li class=\"flex items-start gap-sm\">\r\n<span class=\"material-symbols-outlined text-secondary mt-[2px] text-[20px]\">group_add</span>\r\n<span class=\"font-body-md text-body-md text-on-surface\">Quản lý nhiều workspace</span>\r\n</li>\r\n<li class=\"flex items-start gap-sm\">\r\n<span class=\"material-symbols-outlined text-secondary mt-[2px] text-[20px]\">api</span>\r\n<span class=\"font-body-md text-body-md text-on-surface\">API / white-label sau pilot</span>\r\n</li>\r\n</ul>\r\n<button class=\"w-full py-md px-lg rounded-full bg-secondary-container text-on-secondary-container font-label-lg text-label-lg hover:bg-secondary-container/80 transition-colors\">\r\n                        Liên hệ tư vấn\r\n                    </button>\r\n</div>\r\n</div>\r\n</section>\r\n</main>\r\n<!-- Footer -->\r\n<footer class=\"bg-surface-container-low flex justify-between items-center w-full px-margin-desktop py-sm fixed bottom-0 left-0 h-footer-height shadow-[0_-1px_2px_0_rgba(0,0,0,0.05)] z-50\">\r\n<div class=\"font-label-lg text-label-lg font-semibold text-on-surface\">\r\n            © 2026 Scaify AI Intelligence.\r\n        </div>\r\n<div class=\"flex gap-lg\">\r\n<a class=\"font-body-md text-body-md text-secondary hover:underline hover:text-primary transition-all duration-200\" href=\"#\">\r\n                Pitch Deck\r\n            </a>\r\n<a class=\"font-body-md text-body-md text-secondary hover:underline hover:text-primary transition-all duration-200\" href=\"#\">\r\n                Team 072\r\n            </a>\r\n</div>\r\n</footer>\r\n\r\n\r\n</body></html>\r\n"

    "html": "<!DOCTYPE html><html lang=\"vi\"><head>\n<base href=\"file:///C:/AI%20VinUni/A20-App-072/docs/scaify_ai_pitch_deck/slides/\">\r\n<meta charset=\"utf-8\">\r\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\">\r\n<title>Những bước tiến đầu tiên</title>\r\n<!-- Material Symbols -->\r\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\">\r\n<!-- Google Fonts -->\r\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\">\r\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\">\r\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap\" rel=\"stylesheet\">\r\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\">\r\n<!-- Tailwind CSS -->\r\n<script src=\"https://cdn.tailwindcss.com?plugins=forms,container-queries\"><\\/script>\r\n<!-- Tailwind Configuration -->\r\n<script id=\"tailwind-config\">\r\n        tailwind.config = {\r\n            darkMode: \"class\",\r\n            theme: {\r\n                extend: {\r\n                    \"colors\": {\r\n                        \"surface\": \"#fcf8ff\",\r\n                        \"surface-tint\": \"#5249d3\",\r\n                        \"outline-variant\": \"#CBC3D6\",\r\n                        \"inverse-on-surface\": \"#f3effb\",\r\n                        \"surface-container-lowest\": \"#ffffff\",\r\n                        \"background\": \"#fcf8ff\",\r\n                        \"on-secondary\": \"#ffffff\",\r\n                        \"on-surface\": \"#1b1b23\",\r\n                        \"on-tertiary-container\": \"#a4c1ff\",\r\n                        \"on-primary\": \"#ffffff\",\r\n                        \"primary-container\": \"#4136c3\",\r\n                        \"on-tertiary\": \"#ffffff\",\r\n                        \" variant\": \"#392cbb\",\r\n                        \"surface-container\": \"#f0ecf8\",\r\n                        \"secondary\": \"#734aa4\",\r\n                        \"outline\": \"#777586\",\r\n                        \"on-tertiary-fixed-variant\": \"#13448d\"\r\n                    },\r\n                    \"borderRadius\": {\r\n                        \"DEFAULT\": \"0.25rem\",\r\n                        \"lg\": \"0.5rem\",\r\n                        \"xl\": \"0.75rem\",\r\n                        \"full\": \"9999px\"\r\n                    },\r\n                    \"spacing\": {\r\n                        \"margin-mobile\": \"16px\",\r\n                        \"2xl\": \"48px\",\r\n                        \"sm\": \"8px\",\r\n                        \"gutter\": \"24px\",\r\n                        \"md\": \"16px\",\r\n                        \"xs\": \"4px\",\r\n                        \"lg\": \"24px\",\r\n                        \"xl\": \"32px\",\r\n                        \"margin-desktop\": \"32px\",\r\n                        \"3xl\": \"64px\",\r\n                        \"base\": \"8px\"\r\n                    },\r\n                    \"fontFamily\": {\r\n                        \"headline-lg\": [\"Noto Sans\"],\r\n                        \"label-sm\": [\"Noto Sans\"],\r\n                        \"label-lg\": [\"Noto Sans\"],\r\n                        \"body-md\": [\"Noto Sans\"],\r\n                        \"body-lg\": [\"Noto Sans\"],\r\n                        \"title-lg\": [\"Noto Sans\"],\r\n                        \"display-lg\": [\"Noto Sans\"],\r\n                        \"headline-lg-mobile\": [\"Noto Sans\"]\r\n                    },\r\n                    \"fontSize\": {\r\n                        \"headline-lg\": [\"32px\", {\"lineHeight\": \"40px\", \"fontWeight\": \"400\"}],\r\n                        \"label-sm\": [\"11px\", {\"lineHeight\": \"16px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"500\"}],\r\n                        \"label-lg\": [\"14px\", {\"lineHeight\": \"20px\", \"letterSpacing\": \"0.1px\", \"fontWeight\": \"500\"}],\r\n                        \"body-md\": [\"14px\", {\"lineHeight\": \"20px\", \"letterSpacing\": \"0.25px\", \"fontWeight\": \"400\"}],\r\n                        \"body-lg\": [\"16px\", {\"lineHeight\": \"24px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"400\"}],\r\n                        \"title-lg\": [\"22px\", {\"lineHeight\": \"28px\", \"fontWeight\": \"500\"}],\r\n                        \"display-lg\": [\"57px\", {\"lineHeight\": \"64px\", \"letterSpacing\": \"-0.25px\", \"fontWeight\": \"400\"}],\r\n                        \"headline-lg-mobile\": [\"28px\", {\"lineHeight\": \"36px\", \"fontWeight\": \"400\"}]\r\n                    }\r\n                }\r\n            }\r\n        }\r\n    <\\/script>\r\n<style>\r\n        .material-symbols-outlined {\r\n            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;\r\n        }\r\n    </style>\r\n<style data-stitch-cursor=\"\"></style><style data-stitch-scroll-lock=\"\"></style></head>\r\n<body class=\"bg-background text-on-background min-h-screen flex flex-col font-sans\">\r\n<!-- TopAppBar -->\r\n<header class=\"bg-surface flex justify-between items-center w-full px-margin-desktop py-md max-w-full z-50\">\r\n<div class=\"font-headline-lg text-headline-lg font-bold text-primary\"><img src=\"../assets/scaify-logo.png\" alt=\"Scaify Logo\" class=\"h-8 w-auto object-contain\"></div>\r\n<div class=\"flex items-center cursor-pointer transition-opacity active:opacity-70\">\r\n<span class=\"material-symbols-outlined text-primary text-2xl\">account_circle</span>\r\n</div>\r\n</header>\r\n<!-- Main Content Canvas -->\r\n<main class=\"flex-grow w-full max-w-7xl mx-auto px-margin-desktop py-xl pb-3xl\">\r\n<!-- Header Section -->\r\n<div class=\"mb-xl\">\r\n<p class=\"font-label-lg text-label-lg text-secondary mb-xs uppercase tracking-wider\">Traction &amp; Hiện trạng</p>\r\n<h1 class=\"font-display-lg text-display-lg text-on-surface\">Những bước tiến đầu tiên</h1>\r\n<p class=\"font-body-lg text-body-lg text-on-surface-variant mt-sm max-w-2xl\">\r\n                Traction ở giai đoạn này không phải là doanh thu lớn, mà là luồng sản phẩm chạy được end-to-end, có log, có phản hồi và có thể lặp lại trong pilot thật.\r\n            </p>\r\n</div>\r\n<!-- Bento Grid Layout -->\r\n<div class=\"grid grid-cols-1 md:grid-cols-12 gap-gutter\">\r\n<!-- Metrics Card (Col Span 4) -->\r\n<div class=\"md:col-span-4 bg-primary-container rounded-xl p-lg flex flex-col justify-between overflow-hidden relative\">\r\n<div class=\"absolute -right-8 -top-8 w-48 h-48 bg-white opacity-5 rounded-full blur-2xl\"></div>\r\n<div>\r\n<h2 class=\"font-title-lg text-title-lg text-on-primary-container mb-sm\">Luồng lõi đã chạy</h2>\r\n<p class=\"font-body-md text-body-md text-primary-fixed-dim\">Upload, OCR, đối soát, cảnh báo và lưu hồ sơ đã nối thành một pipeline hoàn chỉnh.</p>\r\n</div>\r\n<div class=\"mt-lg\">\r\n<div class=\"font-display-lg text-display-lg text-on-primary-container font-bold leading-none\">1<span class=\"text-3xl\">x</span></div>\r\n<p class=\"font-label-lg text-label-lg text-primary-fixed-dim mt-xs uppercase tracking-wide\">Luồng end-to-end</p>\r\n</div>\r\n</div>\r\n<!-- Features Checklist (Col Span 8) -->\r\n<div class=\"md:col-span-8 bg-surface-container-low border border-outline-variant rounded-xl p-lg\">\r\n<div class=\"flex items-center gap-sm mb-md\">\r\n<span class=\"material-symbols-outlined text-primary\">task_alt</span>\r\n<h2 class=\"font-title-lg text-title-lg text-on-surface\">Tín hiệu đã có</h2>\r\n</div>\r\n<div class=\"grid grid-cols-1 sm:grid-cols-2 gap-md mt-sm\">\r\n<!-- Item 1 -->\r\n<div class=\"bg-surface-container-lowest rounded-lg p-md flex items-start gap-md shadow-sm border border-surface-container-high\">\r\n<span class=\"material-symbols-outlined text-secondary mt-1\" style=\"font-variation-settings: 'FILL' 1;\">check_circle</span>\r\n<div>\r\n<h3 class=\"font-label-lg text-label-lg text-on-surface font-semibold\">Pipeline chạy được</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mt-xs\">Upload → OCR → đối soát → cảnh báo → hồ sơ theo kỳ.</p>\r\n</div>\r\n</div>\r\n<!-- Item 2 -->\r\n<div class=\"bg-surface-container-lowest rounded-lg p-md flex items-start gap-md shadow-sm border border-surface-container-high\">\r\n<span class=\"material-symbols-outlined text-secondary mt-1\" style=\"font-variation-settings: 'FILL' 1;\">check_circle</span>\r\n<div>\r\n<h3 class=\"font-label-lg text-label-lg text-on-surface font-semibold\">Test tự động</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mt-xs\">Có test cho pipeline, compliance score và lớp giải thích.</p>\r\n</div>\r\n</div>\r\n<!-- Item 3 -->\r\n<div class=\"bg-surface-container-lowest rounded-lg p-md flex items-start gap-md shadow-sm border border-surface-container-high\">\r\n<span class=\"material-symbols-outlined text-secondary mt-1\" style=\"font-variation-settings: 'FILL' 1;\">check_circle</span>\r\n<div>\r\n<h3 class=\"font-label-lg text-label-lg text-on-surface font-semibold\">Demo nội bộ</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mt-xs\">Đã có demo nội bộ với log phản hồi để tiếp tục lặp sản phẩm.</p>\r\n</div>\r\n</div>\r\n<!-- Item 4 -->\r\n<div class=\"bg-surface-container-lowest rounded-lg p-md flex items-start gap-md shadow-sm border border-surface-container-high\">\r\n<span class=\"material-symbols-outlined text-secondary mt-1\" style=\"font-variation-settings: 'FILL' 1;\">check_circle</span>\r\n<div>\r\n<h3 class=\"font-label-lg text-label-lg text-on-surface font-semibold\">Proof có thể chỉ ra</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mt-xs\">Có PRD, kiến trúc, và hồ sơ để giải thích vì sao kết quả ra như vậy.</p>\r\n</div>\r\n</div>\r\n</div>\r\n</div>\r\n<!-- Lessons Learned (Col Span 5) -->\r\n<div class=\"md:col-span-5 bg-surface-container rounded-xl p-lg border border-surface-variant\">\r\n<div class=\"flex items-center gap-sm mb-md\">\r\n<span class=\"material-symbols-outlined text-tertiary\">lightbulb</span>\r\n<h2 class=\"font-title-lg text-title-lg text-on-surface\">Bài học từ pilot</h2>\r\n</div>\r\n<div class=\"space-y-md\">\r\n<div class=\"relative pl-lg before:content-[''] before:absolute before:left-0 before:top-2 before:w-2 before:h-2 before:bg-tertiary before:rounded-full\">\r\n<h4 class=\"font-label-lg text-label-lg text-on-surface font-semibold\">Người dùng cần một luồng rất ngắn</h4>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">Upload → đối soát → thấy lệch → hiểu vì sao là đủ để tạo giá trị ban đầu.</p>\r\n</div>\r\n<div class=\"relative pl-lg before:content-[''] before:absolute before:left-0 before:top-2 before:w-2 before:h-2 before:bg-tertiary before:rounded-full\">\r\n<h4 class=\"font-label-lg text-label-lg text-on-surface font-semibold\">Giá trị nằm ở traceability</h4>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant\">Khả năng truy vết file nào tạo ra kết quả nào mới là thứ khiến người dùng tin.</p>\r\n</div>\r\n</div>\r\n</div>\r\n<!-- Goals (Col Span 7) -->\r\n<div class=\"md:col-span-7 bg-surface-container-lowest border-2 border-primary rounded-xl overflow-hidden flex flex-col md:flex-row relative group\">\r\n<!-- Abstract Background for Visual Interest -->\r\n<div class=\"absolute inset-0 z-0 bg-cover bg-center opacity-10 transition-transform duration-700 group-hover:scale-105\" data-alt=\"A futuristic, abstract corporate visualization representing exponential growth and forward momentum. The image features sleek, glowing indigo and violet geometric lines zooming upward against a soft, light grey minimalist background, creating a sense of speed and high-tech scalability. The lighting is bright and clean, fitting a modern light-mode enterprise dashboard aesthetic. It conveys a professional, optimistic, and data-driven mood.\" style=\"background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD1XNQ3r3tcsAmBcGxZjzomuKmil3TvHbGSEHDYOklUoazGwer0Z_x9ZAv_fL5HYDxhJ9Hzv1UP98RYExhRdaDWW8CdrrB8ExUNMOqFe-U_jKuibSOtETQEyH_1Y3mbfU2KEqj9uI1r2TDeveKQqZW15chCDDlPgU3dtHb_vnv5cpApl9GVh4jHAvWlag08RhBnbMmfhoz_b7E1tM6BgbV1a6A8r-RJAewYJMj8-EgPxVkWk7bgVgk-v5EyznrDmLoec5ixhKk9G18');\">\r\n</div>\r\n<div class=\"p-lg flex flex-col justify-center relative z-10 w-full\">\r\n<div class=\"inline-flex items-center gap-2 bg-primary-fixed px-sm py-xs rounded-full w-fit mb-sm\">\r\n<span class=\"material-symbols-outlined text-on-primary-fixed text-sm\">rocket_launch</span>\r\n<span class=\"font-label-sm text-label-sm text-on-primary-fixed uppercase font-bold tracking-widest\">Mục tiêu 3-6 tháng tới</span>\r\n</div>\r\n<h2 class=\"font-display-lg text-headline-lg text-primary font-bold leading-tight mb-sm\">\r\n                        Mục tiêu tiếp theo:<br>\r\n<span class=\"text-4xl md:text-5xl border-b-4 border-secondary pb-1\">50 khách hàng pilot</span>\r\n</h2>\r\n<ul class=\"mt-md space-y-sm\">\r\n<li class=\"flex items-center gap-sm font-body-md text-body-md text-on-surface-variant\">\r\n<span class=\"material-symbols-outlined text-primary text-sm\">arrow_forward</span>\r\n                            Thu thập phản hồi thật từ người bán tự ghi chép.\r\n                        </li>\r\n<li class=\"flex items-center gap-sm font-body-md text-body-md text-on-surface-variant\">\r\n<span class=\"material-symbols-outlined text-primary text-sm\">arrow_forward</span>\r\n                            Tinh chỉnh cảnh báo, ngưỡng và Explain Tax.\r\n                        </li>\r\n<li class=\"flex items-center gap-sm font-body-md text-body-md text-on-surface-variant\">\r\n<span class=\"material-symbols-outlined text-primary text-sm\">arrow_forward</span>\r\n                            Hoàn thiện workflow và lớp giải thích trước khi mở rộng.\r\n                        </li>\r\n</ul>\r\n</div>\r\n</div>\r\n</div>\r\n</main>\r\n<!-- Footer -->\r\n<footer class=\"bg-surface-container-low flex justify-between items-center w-full px-margin-desktop py-sm fixed bottom-0 left-0 z-50\">\r\n<div class=\"font-label-lg text-label-lg font-semibold text-on-surface\">© 2026 Scaify AI Intelligence.</div>\r\n<div class=\"flex gap-gutter\">\r\n<a class=\"font-body-md text-body-md text-secondary hover:underline hover:text-primary transition-all duration-200\" href=\"#\">Pitch Deck</a>\r\n<a class=\"font-body-md text-body-md text-secondary hover:underline hover:text-primary transition-all duration-200\" href=\"#\">Team 072</a>\r\n</div>\r\n</footer>\r\n\r\n\r\n</body></html>\r\n"

-->\r\n<h1 class=\"font-display-lg text-display-lg text-on-surface font\">Lộ trình thương mại hóa</h1>\r\n<p class=\"font-body-lg text-body-lg text-on-surface-variant max-w-5xl mt-md\">Freemium trước, subscription sau, workspace + API tiếp theo. Mỗi chặng đều gắn với một mốc người dùng và doanh thu cụ thể.</p>\r\n</div>\r\n<!-- Timeline Section -->\r\n<div class=\"relative w-full mt-xl flex-grow flex items-center\">\r\n<!-- Connecting Line Background (Desktop) -->\r\n<div class=\"hidden md:block absolute top-1/2 left-0 w-full h-[2px] bg-outline-variant -translate-y-1/2 z-0\"></div>\r\n<div class=\"grid grid-cols-1 md:grid-cols-3 gap-gutter w-full relative z-10\">\r\n<!-- Phase 1 -->\r\n<div class=\"relative group\">\r\n<!-- Mobile Connecting Line -->\r\n<div class=\"block md:hidden absolute left-8 top-16 bottom-[-24px] w-[2px] bg-outline-variant z-0\"></div>\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant transition-all duration-300 hover:bg-surface-container-high hover:border-primary relative z-10 h-full flex flex-col\">\r\n<div class=\"flex items-center gap-md mb-lg\">\r\n<div class=\"w-16 h-16 rounded-full bg-primary text-on-primary flex items-center justify-center font-title-lg text-title-lg font-bold shadow-md\">\r\n                                1\r\n                            </div>\r\n<span class=\"material-symbols-outlined text-primary text-headline-lg\" data-icon=\"rocket_launch\" style=\"font-variation-settings: 'FILL' 1;\">rocket_launch</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface font-semibold mb-sm\">Chặng 1: Soft launch</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant flex-grow\">\r\n                            Mục tiêu: 500 user đầu tiên, 200 active users, 50 user quay lại tháng 2, NPS >= 40. Kênh chính: Facebook groups, SEO blog, email outreach và partnership dịch vụ thuế.\r\n                        </p>\r\n</div>\r\n</div>\r\n<!-- Phase 2 -->\r\n<div class=\"relative group mt-xl md:mt-0\">\r\n<!-- Mobile Connecting Line -->\r\n<div class=\"block md:hidden absolute left-8 top-16 bottom-[-24px] w-[2px] bg-outline-variant z-0\"></div>\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant transition-all duration-300 hover:bg-surface-container-high hover:border-primary relative z-10 h-full flex flex-col\">\r\n<div class=\"flex items-center gap-md mb-lg\">\r\n<div class=\"w-16 h-16 rounded-full bg-surface-variant text-on-surface-variant border border-outline-variant flex items-center justify-center font-title-lg text-title-lg font-bold transition-colors group-hover:bg-primary-container group-hover:text-on-primary-container group-hover:border-primary-container\">\r\n                                2\r\n                            </div>\r\n<span class=\"material-symbols-outlined text-secondary text-headline-lg transition-colors group-hover:text-primary\" data-icon=\"manufacturing\" style=\"font-variation-settings: 'FILL' 1;\">manufacturing</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface font-semibold mb-sm\">Chặng 2: Growth</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant flex-grow\">\r\n                            Mục tiêu: 5.000 users, 250 user trả phí, doanh thu khoảng 25 triệu/tháng. Kênh: ads, content, affiliate, partnership và TikTok organic.\r\n                        </p>\r\n</div>\r\n</div>\r\n<!-- Phase 3 -->\r\n<div class=\"relative group mt-xl md:mt-0\">\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant transition-all duration-300 hover:bg-surface-container-high hover:border-primary relative z-10 h-full flex flex-col\">\r\n<div class=\"flex items-center gap-md mb-lg\">\r\n<div class=\"w-16 h-16 rounded-full bg-surface-variant text-on-surface-variant border border-outline-variant flex items-center justify-center font-title-lg text-title-lg font-bold transition-colors group-hover:bg-primary-container group-hover:text-on-primary-container group-hover:border-primary-container\">\r\n                                3\r\n                            </div>\r\n<span class=\"material-symbols-outlined text-tertiary text-headline-lg transition-colors group-hover:text-primary\" data-icon=\"monitoring\" style=\"font-variation-settings: 'FILL' 1;\">monitoring</span>\r\n</div>\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface font-semibold mb-sm\">Chặng 3: Scale</h3>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant flex-grow\">\r\n                            Mục tiêu: 20.000 users, mở rộng kênh B2B, thêm xuất PDF và retention, chuẩn bị bước sang workspace + API.\r\n                        </p>\r\n</div>\r\n</div>\r\n</div>\r\n</div>\r\n</main>\r\n<!-- Footer -->\r\n<footer class=\"bg-surface-container-low dark:bg-inverse-surface docked full-width bottom-0 flat no shadows flex flex-col md:flex-row justify-between items-center w-full px-margin-desktop py-md md:py-sm mt-auto relative z-50\">\r\n<div class=\"font-label-lg text-label-lg font-semibold text-on-surface dark:text-surface-lowest mb-sm md:mb-0\">\r\n            Scaify\r\n        </div>\r\n<div class=\"font-body-md text-body-md text-secondary dark:text-secondary-fixed-dim text-center md:text-left mb-sm md:mb-0\">\r\n            © 2026 Scaify AI Intelligence.\r\n        </div>\r\n<div class=\"flex gap-lg\">\r\n<a class=\"font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant hover:underline hover:text-primary dark:hover:text-primary-fixed-dim transition-all duration-200\" href=\"#\">Pitch Deck</a>\r\n<a class=\"font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant hover:underline hover:text-primary dark:hover:text-primary-fixed-dim transition-all duration-200\" href=\"#\">Team 072</a>\r\n</div>\r\n</footer>\r\n\r\n\r\n</body></html>\r\n"

caify Logo\" class=\"h-8 w-auto object-contain\"></div>\r\n<div class=\"flex items-center gap-md\">\r\n<button type=\"button\" class=\"cursor-pointer transition-opacity active:opacity-70 w-10 h-10 rounded-full hover:bg-surface-container flex items-center justify-center text-primary\" aria-hidden=\"true\">\r\n<span class=\"material-symbols-outlined\" data-icon=\"account_circle\">account_circle</span>\r\n</button>\r\n</div>\r\n</header>\r\n\r\n<main class=\"flex-grow flex flex-col px-margin-desktop py-xl overflow-y-auto min-h-0 relative overscroll-y-contain\">\r\n<div class=\"absolute top-0 right-0 w-[520px] h-[520px] bg-primary-fixed-dim opacity-10 rounded-full blur-[90px] -translate-y-1/3 translate-x-1/4 pointer-events-none\"></div>\r\n<div class=\"absolute bottom-0 left-0 w-[420px] h-[420px] bg-secondary-fixed-dim opacity-10 rounded-full blur-[70px] translate-y-1/4 -translate-x-1/4 pointer-events-none\"></div>\r\n\r\n<div class=\"relative z-10 grid grid-cols-12 gap-gutter min-h-0 w-full max-w-[1600px] mx-auto\">\r\n<!-- Tiêu đề cột trái -->\r\n<div class=\"col-span-12 lg:col-span-5 flex flex-col justify-start gap-md\">\r\n<h1 class=\"font-display-lg text-display-lg md:text-[clamp(2rem,4vw,3.5rem)] md:leading-tight text-on-surface font leading-tight\">\r\n                Đội ngũ có đủ<br><span class=\"text-primary\">năng lực thực thi?</span>\r\n</h1>\r\n</div>\r\n\r\n<!-- Hai thẻ nội dung -->\r\n<div class=\"col-span-12 lg:col-span-7 flex flex-col gap-md min-h-0\">\r\n<div class=\"grid grid-cols-1 md:grid-cols-2 gap-md flex-1 min-h-0\">\r\n<div class=\"bg-surface-container-low rounded-xl p-lg border border-outline-variant flex flex-col h-full\">\r\n<div class=\"flex items-start gap-md mb-md\">\r\n<div class=\"w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0\">\r\n<span class=\"material-symbols-outlined text-primary text-[28px]\">groups</span>\r\n</div>\r\n<div>\r\n<h2 class=\"font-title-lg text-title-lg text-on-surface font-semibold\">Nhóm dự án VinUni</h2>\r\n<p class=\"font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide mt-xs\">A20-App-072</p>\r\n</div>\r\n</div>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant flex-grow leading-relaxed\">\r\n                        Đa ngành (AI/ML, kỹ thuật phần mềm, bối cảnh thuế TMĐT) triển khai MVP Scaify: đối soát <strong>CSV ↔ chứng từ</strong> (OCR/VLM), preview thuế &amp; ngưỡng, <strong>Explain Tax</strong>, RAG pháp lý, dashboard minh bạch.\r\n                    </p>\r\n</div>\r\n<div class=\"bg-surface-container rounded-xl p-lg border border-outline-variant flex flex-col h-full\">\r\n<div class=\"flex items-start gap-md mb-md\">\r\n<div class=\"w-12 h-12 rounded-full bg-tertiary-container flex items-center justify-center shrink-0\">\r\n<span class=\"material-symbols-outlined text-on-tertiary-container text-[28px]\" style=\"font-variation-settings: 'FILL' 1;\">verified</span>\r\n</div>\r\n<div>\r\n<h2 class=\"font-title-lg text-title-lg text-on-surface font-semibold\">Bằng chứng thực thi</h2>\r\n<p class=\"font-label-sm text-label-sm text-on-surface-variant mt-xs\">Proof, không chỉ mô tả</p>\r\n</div>\r\n</div>\r\n<ul class=\"space-y-sm font-body-md text-body-md text-on-surface-variant\">\r\n<li class=\"flex gap-sm\"><span class=\"material-symbols-outlined text-tertiary text-lg shrink-0\">check_circle</span><span>Test tự động: pipeline, compliance score, RAG chatbot.</span></li>\r\n<li class=\"flex gap-sm\"><span class=\"material-symbols-outlined text-tertiary text-lg shrink-0\">check_circle</span><span>PRD, kiến trúc, chunk pháp lý phục vụ RAG.</span></li>\r\n<li class=\"flex gap-sm\"><span class=\"material-symbols-outlined text-tertiary text-lg shrink-0\">check_circle</span><span>Demo pilot nội bộ, có log phản hồi để lặp.</span></li>\r\n</ul>\r\n</div>\r\n</div>\r\n\r\n<!-- Dải disclaimer full width trong cột phải -->\r\n<div class=\"rounded-xl border border-outline-variant/80 bg-primary/5 px-lg ans\"],\r\n                        \"body-lg\": [\"Noto Sans\"],\r\n                        \"title-lg\": [\"Noto Sans\"],\r\n                        \"display-lg\": [\"Noto Sans\"],\r\n                        \"headline-lg-mobile\": [\"Noto Sans\"]\r\n                    },\r\n                    \"fontSize\": {\r\n                        \"headline-lg\": [\"32px\", { \"lineHeight\": \"40px\", \"fontWeight\": \"400\" }],\r\n                        \"label-sm\": [\"11px\", { \"lineHeight\": \"16px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"500\" }],\r\n                        \"label-lg\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.1px\", \"fontWeight\": \"500\" }],\r\n                        \"body-md\": [\"14px\", { \"lineHeight\": \"20px\", \"letterSpacing\": \"0.25px\", \"fontWeight\": \"400\" }],\r\n                        \"body-lg\": [\"16px\", { \"lineHeight\": \"24px\", \"letterSpacing\": \"0.5px\", \"fontWeight\": \"400\" }],\r\n                        \"title-lg\": [\"22px\", { \"lineHeight\": \"28px\", \"fontWeight\": \"500\" }],\r\n                        \"display-lg\": [\"57px\", { \"lineHeight\": \"64px\", \"letterSpacing\": \"-0.25px\", \"fontWeight\": \"400\" }],\r\n                        \"headline-lg-mobile\": [\"28px\", { \"lineHeight\": \"36px\", \"fontWeight\": \"400\" }]\r\n                    }\r\n                }\r\n            }\r\n        }\r\n    <\\/script>\r\n<style data-stitch-cursor=\"\"></style><style data-stitch-scroll-lock=\"\"></style></head>\r\n<body class=\"bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md pt-20 pb-20\">\r\n<!-- TopAppBar Component (from JSON) -->\r\n<header class=\"bg-surface dark:bg-on-surface flex justify-between items-center w-full px-margin-desktop py-md max-w-full fixed top-0 left-0 z-50\">\r\n<div class=\"cursor-pointer transition-opacity active:opacity-70\"><img src=\"../assets/scaify-logo.png\" alt=\"Scaify Logo\" class=\"h-10 w-auto object-contain\"></div>\r\n<div class=\"flex items-center gap-md\">\r\n<span class=\"material-symbols-outlined text-primary dark:text-primary-fixed-dim cursor-pointer transition-opacity active:opacity-70 hover:text-primary-container dark:hover:text-primary-fixed-dim transition-colors\" data-icon=\"account_circle\">account_circle</span>\r\n</div>\r\n</header>\r\n<!-- Main Content Canvas -->\r\n<main class=\"flex-grow w-full max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop py-xl\">\r\n<!-- Section Header -->\r\n<div class=\"mb-xl\">\r\n<h1 class=\"font-display-lg text-display-lg text-on-surface mb-sm tracking-tight\">Kêu gọi đầu tư</h1>\r\n<!-- <p class=\"font-title-lg text-title-lg text-on-surface-variant\">Theo khung pitch: <strong>Ask rõ</strong> nhu cầu vốn → <strong>mục tiêu đo được</strong> trong 6 tháng → phân bổ chi phí minh bạch.</p> -->\r\n</div>\r\n<!-- Ask clarity -->\r\n<div class=\"mb-xl rounded-xl border border-primary/25 bg-primary-fixed/30 px-lg py-md max-w-4xl\">\r\n<p class=\"font-body-md text-body-md text-on-surface\"><strong>Ai trả tiền (trung hạn):</strong> gói SaaS / pilot trả phí cho HKD &amp; cá nhân kinh doanh online; <strong>đợt gọi vốn này để:</strong> hoàn thiện pipeline đối soát + RAG pháp lý + bằng chứng vận hành (50 người dùng pilot có log phản hồi).</p>\r\n</div>\r\n<!-- Bento Grid Layout -->\r\n<div class=\"grid grid-cols-1 md:grid-cols-12 gap-gutter\">\r\n<!-- Key Metric: The Ask -->\r\n<div class=\"md:col-span-6 bg-surface-container-lowest rounded-xl p-xl border border-outline-variant shadow-sm flex flex-col justify-center relative overflow-hidden\">\r\n<div class=\"absolute -right-10 -top-10 w-48 h-48 bg-primary opacity-5 rounded-full blur-2xl\"></div>\r\n<h2 class=\"font-label-lg text-label-lg text-secondary uppercase tracking-widest mb-sm font-semibold\">Nhu Cầu Vốn Giai Đoạn 1</h2>\r\n<div class=\"font-display-lg text-display-lg text-primary font-bold flex items-baseline gap-sm\">\r\n                    500\r\n                    <span class=\"font-title-lg text-title-lg text-on-surface-variant font-normal\">Triệu VNĐ</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mt-md max-w-[80%]\">\r\n                    Khoản đầu tư hạt giống nhằm xây dựng hạ tầng kỹ thuật cốt lõi và triển khai chiến dịch thu hút người dùng thử nghiệm đầu tiên.\r\n                </p>\r\n</div>\r\n<!-- Key Metric: The Goal -->\r\n<div class=\"md:col-span-6 bg-surface-container-lowest rounded-xl p-xl border border-outline-variant shadow-sm flex flex-col justify-center relative overflow-hidden\">\r\n<div class=\"absolute -left-10 -bottom-10 w-48 h-48 bg-tertiary opacity-5 rounded-full blur-2xl\"></div>\r\n<h2 class=\"font-label-lg text-label-lg text-secondary uppercase tracking-widest mb-sm font-semibold\">Mục Tiêu 6 Tháng Tới</h2>\r\n<div class=\"font-display-lg text-display-lg text-on-surface font-bold flex items-baseline gap-sm\">\r\n                    50\r\n                    <span class=\"font-title-lg text-title-lg text-on-surface-variant font-normal\">Khách Hàng Pilot</span>\r\n</div>\r\n<p class=\"font-body-md text-body-md text-on-surface-variant mt-md max-w-[80%]\">\r\n                    Tập trung <strong>người bán tự ghi CSV</strong> (MXH, web) để thu thập phản hồi thật, tinh chỉnh cảnh báo lệch &amp; Explain Tax — <strong>không</strong> nhắm “SME kế toán đầy đủ” trong giai đoạn seed.\r\n                </p>\r\n</div>\r\n<!-- Chart Section: Resource Allocation -->\r\n<div class=\"md:col-span-12 bg-surface-container-lowest rounded-xl p-xl border border-outline-variant shadow-sm mt-md\">\r\n<h3 class=\"font-title-lg text-title-lg text-on-surface mb-lg font-semibold border-b border-outline-variant pb-md\">Phân Bổ Nguồn Lực Phân Bổ (Dự Kiến)</h3>\r\n<div class=\"flex flex-col md:flex-row items-center gap-2xl\">\r\n<!-- CSS Pie Chart (Using Conic Gradient) -->\r\n<!-- Breakdown: \r\n                         Tech (Primary #2812ad): 35% -> 0 to 126deg\r\n                         AI/Infra (Tertiary #003578): 25% -> 126deg to 216deg\r\n                         User Research (Secondary #734aa4): 20% -> 216deg to 288deg\r\n                         Marketing (Primary Container #4136c3): 15% -> 288deg to 342deg\r\n                         Contingency (Surface Tint #5249d3): 5% -> 342deg to 360deg \r\n                    -->\r\n<div class=\"relative w-64 h-64 shrink-0 rounded-full flex items-center justify-center shadow-inner\" style=\"background: conic-gradient(\r\n                            #2812ad 0deg 126deg,\r\n                            #003578 126deg 216deg,\r\n                            #734aa4 216deg 288deg,\r\n                            #4136c3 288deg 342deg,\r\n                            #5249d3 342deg 360deg\r\n                         );\">\r\n<!-- Donut hole for modern look -->\r\n<div class=\"w-40 h-40 bg-surface-container-lowest rounded-full flex items-center justify-center shadow-sm\">\r\n<span class=\"font-title-lg text-title-lg text-on-surface font-bold text-center leading-tight\">Tổng Quan<br>Chi Phí</span>\r\n</div>\r\n</div>\r\n<!-- Chart Legend -->\r\n<div class=\"flex-grow w-full\">\r\n<ul class=\"space-y-md\">\r\n<!-- Legend Item 1 -->\r\n<li class=\"flex items-center justify-between p-md rounded-lg bg-surface hover:bg-surface-container-high transition-colors\">\r\n<div class=\"flex items-center gap-md\">\r\n<div class=\"w-4 h-4 rounded-full bg-primary shadow-sm\"></div>\r\n<span class=\"font-body-lg text-body-lg text-on-surface font-medium\">Phát Triển Kỹ Thuật &amp; Sản Phẩm</span>\r\n</div>\r\n<span class=\"font-title-lg text-title-lg text-primary font-bold\">35%</span>\r\n</li>\r\n<!-- Legend Item 2 -->\r\n<li class=\"flex items-center justify-between p-md rounded-lg bg-surface hover:bg-surface-container-high transition-colors\">\r\n<div class=\"flex items-center gap-md\">\r\n<div class=\"w-4 h-4 rounded-full bg-tertiary shadow-sm\"></div>\r\n<span class=\"font-body-lg text-body-lg text-on-surface font-mediu       SLIDES.forEach(function (s, i) {
        var o = document.createElement('option');
        o.value = String(i);
        o.textContent = s.title;
        sel.appendChild(o);
      });
      function restoreScriptTags(html) {
        return html.split('<\\/script>').join('<' + '/script>');
      }
      function go(i) {
        idx = Math.max(0, Math.min(SLIDES.length - 1, i));
        iframe.srcdoc = restoreScriptTags(SLIDES[idx].html);
        sel.value = String(idx);
        btnPrev.disabled = idx === 0;
        btnNext.disabled = idx === SLIDES.length - 1;
      }
      btnPrev.addEventListener('click', function () { go(idx - 1); });
      btnNext.addEventListener('click', function () { go(idx + 1); });
      sel.addEventListener('change', function () { go(parseInt(sel.value, 10) || 0); });
      document.addEventListener('keydown', function (e) {
        if (e.target === sel) return;
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(idx + 1); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(idx - 1); }
        else if (e.key === 'Home') { e.preventDefault(); go(0); }
        else if (e.key === 'End') { e.preventDefault(); go(SLIDES.length - 1); }
      });
      go(0);
    })();
  </script>
</body>
</html>
