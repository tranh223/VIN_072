# Bản Nginx cho production có Let's Encrypt (VM).
# Trên VM: copy thành nginx.ssl.conf (cạnh docker-compose.yml), rồi mount:
#   - ./nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
#   - /etc/letsencrypt:/etc/letsencrypt:ro
# và mở port 443 trong docker-compose (ui: "443:443").
#
# Đường dẫn cert trùng với: ls /etc/letsencrypt/live/scaify.35.198.225.24.nip.io/

# HTTP: hostname nip.io → HTTPS
server {
    listen 80;
    server_name scaify.35.198.225.24.nip.io;
    return 301 https://$host$request_uri;
}

# HTTP: truy cập bằng IP hoặc host khác (không bắt buộc redirect)
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /api {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
    }

    location /rag {
        proxy_pass          http://rag:8001;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS — symlink fullchain.pem / privkey.pem trong live/<domain>/
server {
    listen 443 ssl;
    server_name scaify.35.198.225.24.nip.io;

    ssl_certificate     /etc/letsencrypt/live/scaify.35.198.225.24.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scaify.35.198.225.24.nip.io/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /api {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
    }

    location /rag {
        proxy_pass          http://rag:8001;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
